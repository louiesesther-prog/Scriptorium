<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' unpkg.com cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' unpkg.com cdn.jsdelivr.net; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' unpkg.com cdn.jsdelivr.net; img-src 'self' data: *.tile.openstreetmap.org *.basemaps.cartocdn.com upload.wikimedia.org; img-src-elem 'self' data: *.tile.openstreetmap.org *.basemaps.cartocdn.com upload.wikimedia.org; connect-src 'self' *.tile.openstreetmap.org *.basemaps.cartocdn.com; frame-src 'none';">
    <meta charset="UTF-8">
    <meta property="og:title" content="SCRIPTORIUM | Login">
    <meta name="description" content="Scriptorium — a digital archive of biblical texts, maps, genealogies, and manuscript studies.">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTORIUM | Access the Archive</title>
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <link rel="stylesheet" href="assets/css/features.css">
    <link rel="manifest" href="/manifest.json">
    <script src="assets/audio/scriptorium-audio.js" defer></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/sidebar.js"></script>
    <style>
        :root{--obsidian:#050505;--museum-gold:#d4af37;--museum-gold-dim:rgba(212,175,55,0.4);--museum-gold-faint:rgba(212,175,55,0.08);}
        body{padding-left:80px;}
        .glow-overlay{position:fixed;inset:0;background:radial-gradient(circle,rgba(212,175,55,0.04) 0%,transparent 70%);pointer-events:none;}
        .login-box{width:400px;max-width:90vw;padding:50px 44px;background:rgba(10,10,10,0.88);border:1px solid var(--museum-gold-dim);backdrop-filter:blur(20px);text-align:center;box-shadow:0 0 100px rgba(0,0,0,1);position:relative;z-index:1;border-radius:4px;transition:opacity 0.8s ease,transform 0.8s ease;}
        .login-box.authenticating{opacity:0;transform:scale(0.96) translateY(10px);}
        .login-box .label{font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:5px;color:rgba(212,175,55,0.5);display:block;margin-bottom:8px;}
        .login-box h1{font-size: 1.92rem;letter-spacing:8px;color:var(--museum-gold);margin:0 0 32px;text-shadow:0 0 30px rgba(212,175,55,0.06);}
        .input-group{margin-bottom:24px;text-align:left;}
        .input-group label{display:block;font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:2px;color:rgba(212,175,55,0.85);margin-bottom:4px;}
        .input-group input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(212,175,55,0.17);color:rgba(255,255,255,0.98);font-family:'Cormorant Garamond',serif;font-size: 0.66rem;padding:8px 2px;outline:none;transition:border-color 0.3s,color 0.3s;}
        .input-group input:focus{border-bottom-color:rgba(212,175,55,0.5);color:#fff;}
        .input-group input::placeholder{color: var(--text-secondary);font-style:italic;}
        .seal-btn{background:transparent;border:1px solid rgba(212,175,55,0.2);color:rgba(212,175,55,0.7);padding:14px 40px;font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:4px;cursor:pointer;border-radius:4px;transition:all 0.5s ease;margin-top:12px;}
        .seal-btn:hover{background:var(--museum-gold);color:#000;box-shadow:0 0 30px rgba(212,175,55,0.2);}
        .seal-btn:disabled{opacity:0.3;cursor:not-allowed;}
        .seal-btn:disabled:hover{background:transparent;color:var(--museum-gold-dim);box-shadow:none;}
        .error-msg{font-family:'Cormorant Garamond',serif;font-size: 0.66rem;color:#e53935;margin-top:12px;min-height:20px;font-style:italic;}
        .links{margin-top:16px;}
        .links a{font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:2px;color: var(--text-secondary);text-decoration:none;transition:color 0.3s;display:block;margin:8px 0;}
        .links a:hover{color:rgba(212,175,55,0.85);}
        .back-link{display:block;margin-top:16px;font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:2px;color: var(--text-secondary);text-decoration:none;transition:color 0.3s;}
        .back-link:hover{color:rgba(212,175,55,0.85);}
        .forgot-panel{display:none;margin-top:16px;padding-top:16px;border-top:1px solid rgba(212,175,55,0.04);}
        .forgot-panel h3{font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:3px;color:var(--museum-gold-dim);margin:0 0 8px;}
        .forgot-panel p{font-family:'Cormorant Garamond',serif;font-size: 0.66rem;color: var(--text-secondary);margin:0 0 12px;}
        .forgot-panel input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(212,175,55,0.08);color:rgba(255,255,255,0.98);font-family:'Cormorant Garamond',serif;font-size: 0.66rem;padding:6px 2px;outline:none;margin-bottom:12px;}
        .forgot-panel button{background:transparent;border:1px solid rgba(212,175,55,0.1);color:rgba(212,175,55,0.3);padding:8px 20px;font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:2px;cursor:pointer;border-radius:3px;transition:0.3s;margin-bottom:8px;}
        .forgot-panel button:hover{border-color:var(--museum-gold);color:var(--museum-gold);}
        @keyframes shake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-4px)}20%,40%,60%,80%{transform:translateX(4px)}}
        .shake{animation:shake 0.4s ease;}
        .toast-container{position:fixed;top:20px;right:20px;z-index:20000;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
        .toast{pointer-events:auto;padding:12px 20px;border-radius:3px;font-family:'Cinzel',serif;font-size:var(--text-micro);letter-spacing:2px;background:rgba(10,10,10,0.95);border:1px solid rgba(212,175,55,0.15);color:rgba(255,255,255,0.6);backdrop-filter:blur(12px);box-shadow:0 4px 30px rgba(0,0,0,0.5);max-width:340px;animation:toastIn 0.4s ease;transition:opacity 0.4s ease,transform 0.4s ease;}
        .toast.toast-out{opacity:0;transform:translateX(40px);}
        .toast.toast-error{border-color:#b84a4a;color:#d48a8a;}
        .toast.toast-success{border-color:rgba(100,200,100,0.4);color:rgba(200,255,200,0.7);}
        @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
    </style>
    <script>document.fonts.ready.then(function(){document.documentElement.classList.add('fonts-loaded')});</script>
</head>
<body>
<div id="sidebarContainer"></div>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<div class="glow-overlay"></div>
<div class="login-box" id="loginBox">
    <span class="label">OFFICE OF THE ARCHIVE</span>
    <h1>ACCESS THE ARCHIVE</h1>
    <div class="input-group">
        <label>SCRIBE ID</label>
        <input type="text" id="loginId" placeholder="Unique_ID_123" required>
    </div>
    <div class="input-group">
        <label>CIPHER KEY</label>
        <input type="password" id="loginPass" onkeydown="if(event.key==='Enter')attemptLogin()" required>
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
            <input type="checkbox" id="rememberMe" style="accent-color:#d4af37;width:14px;height:14px;margin:0;cursor:pointer;">
            <label for="rememberMe" style="font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:2px;color:rgba(212,175,55,0.5);cursor:pointer;">REMEMBER ME</label>
        </div>
        <div style="text-align:right;margin-top:4px;"><a href="#" data-action="event.preventDefault();toggleForgotPanel()" style="font-family:'Montserrat',sans-serif;font-size: 0.66rem;letter-spacing:1px;color:rgba(212,175,55,0.2);text-decoration:none;transition:color 0.3s;" onmouseover="this.style.color='rgba(212,175,55,0.4)'" onmouseout="this.style.color='rgba(212,175,55,0.2)'">RESTORE ACCESS</a></div>
    </div>
    <button class="seal-btn" id="loginBtn" data-action="attemptLogin()">ENTER THE VAULT</button>
    <div class="error-msg" id="loginError"></div>
    <div class="links">
            <a href="register.html">UNDERGO INDUCTION</a>
            <a href="scriptorium.html">ENTER AS GUEST</a>
            <a href="scriptorium.html" class="back-link">&#8592; RETURN TO THE THRESHOLD</a>
        </div>
        <div style="border-top:1px solid rgba(212,175,55,0.04);margin-top:18px;padding-top:14px;">
            <div style="font-family:'Montserrat',sans-serif;font-size: var(--text-micro);letter-spacing:3px;color:rgba(212,175,55,0.08);margin-bottom:8px;">RECEIVE ARCHIVE DISPATCHES</div>
            <form id="loginNewsletterForm" style="display:flex;gap:6px;">
                <input type="email" placeholder="your@vessel.com" required
                    style="flex:1;min-width:0;background:transparent;border:1px solid rgba(212,175,55,0.08);padding:6px 10px;color: var(--text-secondary);font-family:'Cormorant Garamond',serif;font-size:0.65rem;border-radius:2px;outline:none;">
                <button type="submit"
                    style="background:transparent;border:1px solid rgba(212,175,55,0.1);color:rgba(212,175,55,0.15);padding:6px 12px;font-family:'Cinzel',serif;font-size: var(--text-micro);letter-spacing:1px;cursor:pointer;border-radius:2px;white-space:nowrap;transition:all 0.3s;">JOIN</button>
            </form>
            <div id="loginNewsletterMsg" style="font-family:'Cormorant Garamond',serif;font-size: var(--text-micro);color:rgba(212,175,55,0.08);margin-top:4px;font-style:italic;"></div>
        </div>
        <div class="forgot-panel" id="forgotPanel">
        <h3>RESTORE ACCESS</h3>
        <p>Verify your identity to reforge your Cipher Key.</p>
        <input type="email" id="resetEmail" placeholder="Email Parchment">
        <button data-action="reforgeCipher()">SEND RESET LINK</button>
        <button data-action="document.getElementById('forgotPanel').style.display='none'" style="font-size: var(--text-micro);color: var(--text-secondary);border:none;">CANCEL</button>
    </div>
</div>

<script>
    // Ensure ScriptoriumAPI exists even if auth.js fails to load
    if (!window.ScriptoriumAPI) {
        var API = window.SCRIPTORIUM_API || '/api';
        function _api(path,opts){
            opts=opts||{};
            return fetch(API+path,{
                method:opts.method||'GET',
                headers:Object.assign({'Content-Type':'application/json'},opts.headers||{}),
                body:opts.body?JSON.stringify(opts.body):undefined
            }).then(function(r){
                if(!r.ok)return r.json().then(function(e){throw e}).catch(function(e){if(e&&e.error)throw e;throw{error:r.statusText}});
                return r.json();
            });
        }
        window.ScriptoriumAPI={
            login:function(userId,password){return _api('/auth/login',{method:'POST',body:{userId:userId,password:password}})},
            forgotPassword:function(email){return _api('/auth/forgot-password',{method:'POST',body:{email:email}})}
        };
    }

    var MAX_ATTEMPTS = 3;
    var LOCKOUT_MINUTES = 5;

    async function hashPassword(pass) {
        if (!crypto || !crypto.subtle || !crypto.subtle.digest) {
            throw new Error('CRYPTO_UNAVAILABLE');
        }
        var enc = new TextEncoder();
        var buf = await crypto.subtle.digest('SHA-256', enc.encode(pass));
        var arr = Array.from(new Uint8Array(buf));
        return arr.map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
    }

    async function attemptLogin() {
        var id = document.getElementById('loginId').value.trim();
        var pass = document.getElementById('loginPass').value;
        if (!id || !pass) { showLoginError('Both Scribe ID and Cipher Key are required.'); return; }

        var loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'AUTHENTICATING...';

        try {
            var result = await window.ScriptoriumAPI.login(id, pass);
            if (result.token) {
                var remember = document.getElementById('rememberMe').checked;
                var storage = remember ? localStorage : sessionStorage;
                try {
                    storage.setItem('scriptorium_token', result.token);
                    storage.setItem('scriptorium_session', Date.now().toString());
                    if (!remember) {
                        localStorage.removeItem('scriptorium_token');
                        localStorage.removeItem('scriptorium_session');
                    }
                    // Sync sidebar user data
                    if (result.scribe) {
                        if (window.__setUnifiedUser) {
                            window.__setUnifiedUser({
                                _v: 2,
                                profile: { userId: result.scribe.userId, name: result.scribe.name, gender: 'male', location: '—', tradition: result.scribe.tradition || '' },
                                progress: { totalCharacters: 0, dailyChars: 0, dailyDate: '', versesCompleted: 0, ntVerses: 0 },
                                rank: { title: result.scribe.rank || 'INITIATE', knowledgeLevel: '1', lastActive: Date.now() },
                                streak: { current: 0, lastVisit: '' },
                                seal: { epigraphy: 0, astronomy: 0, prophecy: 0, restoration: 0 },
                                meta: { migratedAt: Date.now() }
                            });
                        } else {
                            localStorage.setItem('scriptorium_user', JSON.stringify({
                                _v: 1, name: result.scribe.name,
                                rank: result.scribe.rank || 'INITIATE',
                                totalCharacters: 0, dailyChars: 0, dailyDate: '',
                                streak: 0, knowledgeLevel: '1',
                                userId: result.scribe.userId,
                                lastActive: Date.now(), versesCompleted: 0, ntVerses: 0
                            }));
                        }
                    }
                } catch(e) {}
                if (window.ScriptoriumAudio) { try { ScriptoriumAudio.transitionTo('ot'); } catch(e) {} }
                document.getElementById('loginBox').classList.add('authenticating');
                setTimeout(function() { window.location.href = 'map.html'; }, 1200);
            } else {
                showLoginError(result.error || 'Authentication failed.');
            }
        } catch(e) {
            showLoginError(e.error || 'Connection to the Archive failed. Please ensure the server is running.');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'ENTER THE VAULT';
        }
    }

    function showLoginError(msg) { document.getElementById('loginError').textContent = msg; }

    function toggleForgotPanel() {
        var p = document.getElementById('forgotPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    function showToast(msg, type) {
        if (window.Scr && window.Scr.toast) { window.Scr.toast(msg, type); return; }
        var c = document.getElementById('toastContainer');
        if (!c) return;
        var t = document.createElement('div');
        t.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(function() { t.classList.add('toast-out'); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 5000);
    }

    async function reforgeCipher() {
        var email = document.getElementById('resetEmail').value.trim();
        if (!email) { showToast('Enter your email address.', 'error'); return; }
        try {
            var result = await window.ScriptoriumAPI.forgotPassword(email);
            showToast(result.message || 'If a matching account is found, a reset link will be sent to your email.', 'success');
            document.getElementById('forgotPanel').style.display = 'none';
        } catch(e) {
            showToast(e.error || 'Connection to the Archive failed.', 'error');
        }
    }

    // Check for existing valid session
    var token = Scriptorium.getToken();
    var sess = localStorage.getItem('scriptorium_session') || sessionStorage.getItem('scriptorium_session');
    if (token && sess && Date.now() - parseInt(sess) < 86400000) {
        window.location.href = 'map.html';
    }

    (function() {
        var form = document.getElementById('loginNewsletterForm');
        var msg = document.getElementById('loginNewsletterMsg');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var input = form.querySelector('input[type="email"]');
                if (!input || !input.value) return;
                msg.textContent = 'Dispatching...';
                fetch((window.SCRIPTORIUM_API || '/api') + '/newsletter/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: input.value })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) { msg.textContent = data.error; return; }
                    msg.textContent = data.message || 'A missive is on its way.';
                    input.value = '';
                })
                .catch(function() { msg.textContent = 'The Archive is unreachable.'; });
            });
        }
    })();
</script>
    <script src="assets/js/scriptorium-core.js" defer></script>
<script>(function(){document.body.addEventListener("click",function(e){var t=e.target.closest("[data-action]");if(!t)return;var c=t.getAttribute("data-action");try{(new Function("event",c)).call(t,e)}catch(ex){console.warn("[action]",ex)}})})();</script>
</body>
</html>
