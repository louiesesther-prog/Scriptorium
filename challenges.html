<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' unpkg.com cdn.jsdelivr.net; style-src-elem 'self' 'unsafe-inline' unpkg.com cdn.jsdelivr.net; font-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' unpkg.com cdn.jsdelivr.net; img-src 'self' data: *.tile.openstreetmap.org *.basemaps.cartocdn.com upload.wikimedia.org; img-src-elem 'self' data: *.tile.openstreetmap.org *.basemaps.cartocdn.com upload.wikimedia.org; connect-src 'self' *.tile.openstreetmap.org *.basemaps.cartocdn.com bible-api.com api.scripture.api.bible; frame-src 'none';">
    <meta charset="UTF-8">
    <meta property="og:title" content="SCRIPTORIUM | Challenges">
    <meta name="description" content="Scriptorium — a digital archive of biblical texts, maps, genealogies, and manuscript studies.">
    <meta property="og:description" content="Scriptorium — a digital archive of biblical texts, maps, genealogies, and manuscript studies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://scriptorium-sandy.vercel.app/challenges.html">
    <meta property="og:image" content="https://scriptorium-sandy.vercel.app/og-image.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTORIUM | Monthly Challenges</title>
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <link rel="stylesheet" href="assets/css/features.css">
    <link rel="manifest" href="/manifest.json">
    <script src="assets/audio/scriptorium-audio.js" defer></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/scriptorium-core.js"></script>
    <script src="assets/js/scriptorium-reader.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-dim: rgba(212,175,55,0.4); --gold-faint: rgba(212,175,55,0.08); }
        body { padding: 60px 0 80px 80px; background: #080808; }
        .page-header { max-width:800px; margin:0 auto 40px; padding:0 24px; text-align:center; }
        .page-header .label { font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:5px; color:rgba(212,175,55,0.2); margin-bottom:8px; }
        .page-header h1 { font-family:'Cinzel',serif; font-size:1.56rem; letter-spacing:10px; color:var(--gold); margin:0 0 12px; text-shadow:0 0 30px rgba(212,175,55,0.06); }
        .page-header p { font-family:'Cormorant Garamond',serif; font-size:0.9rem; color: var(--text-secondary); max-width:500px; margin:0 auto; font-style:italic; }
        .current-banner {
            max-width:800px; margin:0 auto 30px; padding:0 24px;
        }
        .current-banner .inner {
            background: rgba(10,10,10,0.85); border:1px solid rgba(212,175,55,0.12);
            border-radius:4px; padding:28px 32px; display:flex;
            justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
        }
        .current-banner .info h2 {
            font-family:'Cinzel',serif; font-size:0.9rem; letter-spacing:4px;
            color:var(--gold); margin:0 0 4px;
        }
        .current-banner .info .meta {
            font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:2px;
            color: var(--text-secondary);
        }
        .current-banner .info .desc {
            font-family:'Cormorant Garamond',serif; font-size:0.72rem;
            color: var(--text-secondary); margin-top:6px;
        }
        .current-banner .action button {
            background:var(--gold); border:none; color:#000; padding:10px 20px;
            font-family:'Cinzel',serif; font-size: var(--text-micro); letter-spacing:2px;
            cursor:pointer; border-radius:2px; transition:box-shadow 0.3s;
            white-space:nowrap;
        }
        .current-banner .action button:hover { box-shadow:0 0 20px rgba(212,175,55,0.3); }
        .current-banner .action button:disabled { opacity:0.3; cursor:not-allowed; box-shadow:none; }
        .current-banner .progress {
            font-family:'Cinzel',serif; font-size: var(--text-micro); letter-spacing:2px;
            color: var(--text-secondary); text-align:right;
        }
        .current-banner .progress .bar {
            height:2px; background:rgba(255,255,255,0.04); border-radius:2px;
            overflow:hidden; width:120px; margin-top:4px;
        }
        .current-banner .progress .bar .fill {
            height:100%; background:var(--gold); transition:width 0.5s;
        }

        .challenges-grid {
            max-width:800px; margin:0 auto; padding:0 24px 60px;
            display:grid; grid-template-columns:1fr 1fr; gap:14px;
        }
        .ch-card {
            background:rgba(10,10,10,0.85); border:1px solid rgba(212,175,55,0.04);
            padding:20px; border-radius:4px; transition:all 0.3s;
            position:relative; overflow:hidden;
        }
        .ch-card:hover { border-color:rgba(212,175,55,0.12); }
        .ch-card .color-bar { position:absolute; top:0; left:0; width:3px; height:100%; }
        .ch-card h3 {
            font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:3px;
            color:var(--gold-dim); margin:0 0 4px;
        }
        .ch-card .month-label {
            font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:2px;
            color: var(--text-secondary); margin-bottom:6px;
        }
        .ch-card .desc {
            font-family:'Cormorant Garamond',serif; font-size:0.65rem;
            color: var(--text-secondary); line-height:1.5; margin-bottom:8px;
        }
        .ch-card .stat {
            font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:1px;
            color: var(--text-secondary); display:flex; gap:10px; margin-bottom:10px;
        }
        .ch-card .actions { display:flex; gap:8px; }
        .ch-card .actions button {
            background:transparent; border:1px solid rgba(212,175,55,0.1);
            color:rgba(212,175,55,0.2); padding:5px 12px;
            font-family:'Cinzel',serif; font-size: var(--text-micro); letter-spacing:2px;
            cursor:pointer; transition:0.3s; border-radius:2px;
        }
        .ch-card .actions button:hover { border-color:var(--gold); color:var(--gold); }
        .ch-card .actions button.primary { background:var(--gold); color:#000; border-color:var(--gold); }
        .ch-card .actions button.primary:hover { box-shadow:0 0 15px rgba(212,175,55,0.2); }
        .ch-card .actions button:disabled { opacity:0.2; cursor:not-allowed; }
        .ch-card .badge {
            font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:2px;
            padding:2px 8px; border-radius:2px; display:inline-block; margin-bottom:6px;
        }
        .ch-card .badge.current { background:rgba(212,175,55,0.1); color:var(--gold-dim); border:1px solid rgba(212,175,55,0.15); }
        .ch-card .badge.coming { background:rgba(255,255,255,0.02); color: var(--text-secondary); border:1px solid rgba(255,255,255,0.03); }
        .ch-card .badge.done { background:rgba(100,200,100,0.08); color:rgba(200,255,200,0.3); border:1px solid rgba(100,200,100,0.1); }
        .ch-card .progress-mini { margin-top:8px; height:1.5px; background:rgba(255,255,255,0.03); border-radius:2px; overflow:hidden; }
        .ch-card .progress-mini .fill { height:100%; background:var(--gold); transition:width 0.5s; }
        .ch-card .progress-mini .fill.done { background:#5a8f5a; }
        .ch-card.completed { border-color:rgba(100,200,100,0.15); }

        .toast-container { position:fixed; top:20px; right:20px; z-index:20000; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
        .toast { pointer-events:auto; padding:12px 20px; border-radius:3px; font-family:'Cinzel',serif; font-size: var(--text-micro); letter-spacing:2px; background:rgba(10,10,10,0.95); border:1px solid rgba(212,175,55,0.15); color:rgba(255,255,255,0.6); backdrop-filter:blur(12px); box-shadow:0 4px 30px rgba(0,0,0,0.5); max-width:340px; animation:toastIn 0.4s ease; transition:opacity 0.4s ease,transform 0.4s ease; }
        .toast.toast-out { opacity:0; transform:translateX(40px); }
        .toast.toast-error { border-color:#b84a4a; color:#d48a8a; }
        .toast.toast-success { border-color:rgba(100,200,100,0.4); color:rgba(200,255,200,0.7); }
        @keyframes toastIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }

        .nav-links { max-width:800px; margin:0 auto; padding:0 24px 40px; text-align:center; }
        .nav-links a { font-family:'Montserrat',sans-serif; font-size: var(--text-micro); letter-spacing:2px; color: var(--text-secondary); text-decoration:none; transition:color 0.3s; margin:0 10px; }
        .nav-links a:hover { color:rgba(212,175,55,0.1); }

        @media(max-width:600px) { .challenges-grid { grid-template-columns:1fr; } .current-banner .inner { flex-direction:column; text-align:center; } }

        .celebrate-overlay {
            position:fixed; top:0; left:0; width:100vw; height:100vh;
            background:rgba(0,0,0,0.85); z-index:30000;
            display:none; justify-content:center; align-items:center;
            backdrop-filter:blur(8px); animation:fadeIn 0.6s ease;
        }
        .celebrate-overlay.show { display:flex; }
        .celebrate-box { text-align:center; padding:48px 40px; max-width:400px; }
        .celebrate-box .ring { width:120px; height:120px; margin:0 auto 20px; position:relative; display:flex; align-items:center; justify-content:center; }
        .celebrate-box .ring svg { width:100%; height:100%; animation:spinSeal 3s linear infinite; }
        .celebrate-box h2 { font-family:'Cinzel',serif; font-size:1rem; letter-spacing:6px; color:#d4af37; margin:0 0 8px; }
        .celebrate-box p { font-family:'Cormorant Garamond',serif; font-size:0.82rem; color: var(--text-secondary); font-style:italic; line-height:1.6; }
        .celebrate-box .close-btn { margin-top:24px; background:transparent; border:1px solid rgba(212,175,55,0.1); color:rgba(212,175,55,0.15); padding:8px 20px; font-family:'Cinzel',serif; font-size: var(--text-micro); letter-spacing:2px; cursor:pointer; border-radius:2px; transition:all 0.3s; }
        .celebrate-box .close-btn:hover { border-color:rgba(212,175,55,0.3); color:rgba(212,175,55,0.3); }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes spinSeal { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    </style>
</head>
<body>
<div id="sidebarContainer"></div>
<div class="page-header">
    <div class="label">MONTHLY DISCIPLINE</div>
    <h1>READING CHALLENGES</h1>
    <p>A new challenge each month. Complete a book of Scripture before the calendar turns.</p>
</div>

<div class="current-banner" id="currentBanner"></div>

<div class="challenges-grid" id="challengesGrid">
    <div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:'Cormorant Garamond',serif;color: var(--text-secondary);font-style:italic;">Loading challenges...</div>
</div>

<div class="nav-links">
    <a href="plans.html">READING PLANS</a>
    <a href="scriptorium.html">RETURN TO THE ARCHIVE</a>
    <a href="login.html">SCRIBE SIGN IN</a>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<div class="celebrate-overlay" id="celebrateOverlay">
    <div class="celebrate-box">
        <div class="ring">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="8 4"/><path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" stroke="#d4af37" stroke-width="1"/><text x="50" y="55" text-anchor="middle" font-family="Cinzel" font-size="10" fill="#d4af37">ACHIEVED</text></svg>
        </div>
        <h2 id="celebrateTitle">CHALLENGE COMPLETE</h2>
        <p id="celebrateDesc">You have finished the monthly challenge. The Archive honors your discipline.</p>
        <button class="close-btn" onclick="document.getElementById('celebrateOverlay').classList.remove('show')">CLOSE</button>
    </div>
</div>

<script>
(function() {
var API_BASE = window.SCRIPTORIUM_API || '/api';
var challenges = [];
var mySubscriptions = [];

var toastContainer = document.getElementById('toastContainer');
function showToast(title, msg, type) {
    if (window.Scr && window.Scr.toast) { window.Scr.toast(title + ' | ' + msg, type); return; }
    var t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
    t.innerHTML = '<div>' + title + '</div><div class="toast-msg" style="font-family:\'Cormorant Garamond\',serif;font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:4px;">' + msg + '</div>';
    toastContainer.appendChild(t);
    setTimeout(function() { t.classList.add('toast-out'); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 5000);
}

function getToken() {
    return window.Scriptorium && window.Scriptorium.getToken ? window.Scriptorium.getToken() : null;
}

function parseReading(ref) {
    var m = ref.match(/^(\S+?)\s*(\d+)(?:\s*-\s*(\d+))?$/);
    if (!m) return null;
    return { book: m[1], chapter: parseInt(m[2], 10) };
}

window.readPassage = function(ref) {
    var parsed = parseReading(ref);
    if (!parsed) return;
    if (window.ScrReader && typeof window.ScrReader.open === 'function') {
        window.ScrReader.open(parsed.book);
        setTimeout(function() {
            if (window.ScrReader && typeof window.ScrReader.goToChapter === 'function') {
                window.ScrReader.goToChapter(parsed.chapter);
            }
        }, 300);
    }
};

function getSub(challengeId) {
    for (var i = 0; i < mySubscriptions.length; i++) {
        if (mySubscriptions[i].challengeId === challengeId) return mySubscriptions[i];
    }
    return null;
}

var currentEl = document.getElementById('currentBanner');

function renderCurrent() {
    var cur = null;
    for (var i = 0; i < challenges.length; i++) {
        if (challenges[i].current) { cur = challenges[i]; break; }
    }
    if (!cur) { currentEl.style.display = 'none'; return; }
    currentEl.style.display = '';
    var sub = getSub(cur.id);
    var isJoined = !!sub;
    var isCompleted = sub && sub.completedAt;
    var pct = sub ? (sub.progress || 0) : 0;
    var reading = (sub && sub.currentReading) || '';
    var readBtn = (!isCompleted && reading) ? '<button onclick="window.readPassage(\'' + reading.replace(/'/g, "\\'") + '\')" style="border-color:rgba(212,175,55,0.15);color:rgba(212,175,55,0.15);margin-left:8px;">READ</button>' : '';
    currentEl.innerHTML =
        '<div class="inner">' +
        '<div class="info">' +
        '<h2>' + cur.book + '</h2>' +
        '<div class="meta">' + cur.monthName + ' &middot; ' + cur.totalChapters + ' chapters &middot; ~' + cur.chaptersPerDay + ' ch/day</div>' +
        '<div class="desc">' + cur.description + '</div>' +
        (!isCompleted && isJoined && reading ? '<div style="font-family:\'Cormorant Garamond\',serif;font-size:0.7rem;color:rgba(212,175,55,0.2);margin-top:6px;">Today: ' + reading + '</div>' : '') +
        '</div>' +
        '<div>' +
        (isCompleted ? '<div class="progress">COMPLETED<div class="bar"><div class="fill" style="width:100%;background:#5a8f5a"></div></div></div>' :
        isJoined ? '<div style="text-align:right"><div class="progress">' + pct + '% &middot; Day ' + (sub.currentDay + 1) + '/' + cur.totalDays + '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div></div><div class="action" style="margin-top:8px;"><button onclick="window.completeChallengeDay(\'' + cur.id + '\')">MARK TODAY</button>' + readBtn + '</div></div>' :
        '<div class="action"><button onclick="window.joinChallenge(\'' + cur.id + '\')">JOIN THIS CHALLENGE</button></div>') +
        '</div>' +
        '</div>';
}

function renderGrid() {
    var grid = document.getElementById('challengesGrid');
    var html = '';
    for (var i = 0; i < challenges.length; i++) {
        var c = challenges[i];
        var sub = getSub(c.id);
        var isJoined = !!sub;
        var isCompleted = sub && sub.completedAt;
        var pct = sub ? (sub.progress || 0) : 0;
        var badge = c.current ? 'current' : (isCompleted ? 'done' : 'coming');
        var badgeText = c.current ? 'ACTIVE' : (isCompleted ? 'COMPLETED' : 'UPCOMING');
        html += '<div class="ch-card' + (isCompleted ? ' completed' : '') + '">' +
            '<div class="color-bar" style="background:' + (c.color || '#666') + '"></div>' +
            '<div class="badge ' + badge + '">' + badgeText + '</div>' +
            '<h3>' + c.book + '</h3>' +
            '<div class="month-label">' + c.monthName + '</div>' +
            '<div class="desc">' + c.description + '</div>' +
            '<div class="stat">' + c.totalChapters + ' chapters &middot; ' + c.totalDays + ' days &middot; ~' + c.chaptersPerDay + ' ch/day</div>';
        if (isJoined) {
            var reading = sub.currentReading || '';
            html += '<div class="progress-mini"><div class="fill' + (isCompleted ? ' done' : '') + '" style="width:' + pct + '%"></div></div>';
            if (!isCompleted && reading) {
                html += '<div style="font-family:\'Cormorant Garamond\',serif;font-size: var(--text-micro);color:rgba(212,175,55,0.12);margin:6px 0 2px;">Today: ' + reading + '</div>';
            }
            html += '<div class="actions">' +
                (isCompleted ? '' : '<button class="primary" onclick="window.completeChallengeDay(\'' + c.id + '\')">MARK TODAY</button>') +
                (!isCompleted && reading ? '<button onclick="window.readPassage(\'' + reading.replace(/'/g, "\\'") + '\')" style="border-color:rgba(212,175,55,0.2);color:rgba(212,175,55,0.2);">READ</button>' : '') +
                '<button onclick="window.unjoinChallenge(\'' + c.id + '\')">LEAVE</button></div>';
        } else {
            html += '<div class="actions"><button class="primary" onclick="window.joinChallenge(\'' + c.id + '\')">JOIN</button></div>';
        }
        html += '</div>';
    }
    grid.innerHTML = html;
}

function loadAll() {
    fetch(API_BASE + '/challenges')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            challenges = data.challenges || [];
            renderCurrent();
            renderGrid();
        })
        .catch(function() {
            document.getElementById('challengesGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:\'Cormorant Garamond\',serif;color: var(--text-secondary);font-style:italic;">Could not reach the Archive.</div>';
        });

    var token = getToken();
    if (token) {
        fetch(API_BASE + '/challenges/my/progress', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                mySubscriptions = data.subscriptions || [];
                renderCurrent();
                renderGrid();
            })
            .catch(function() {});
    }
}

window.joinChallenge = function(challengeId) {
    var token = getToken();
    if (!token) { showToast('AUTH REQUIRED', 'Sign in to join challenges.', 'error'); return; }
    fetch(API_BASE + '/challenges/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ challengeId: challengeId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.error) { showToast('ERROR', data.error, 'error'); return; }
        showToast('JOINED', data.message, 'success');
        mySubscriptions.push(data.subscription);
        renderCurrent();
        renderGrid();
    })
    .catch(function() { showToast('CONNECTION LOST', 'Could not reach the Archive.', 'error'); });
};

window.unjoinChallenge = function(challengeId) {
    var token = getToken();
    if (!token) return;
    fetch(API_BASE + '/challenges/unjoin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ challengeId: challengeId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.error) { showToast('ERROR', data.error, 'error'); return; }
        showToast('LEFT', data.message, '');
        mySubscriptions = mySubscriptions.filter(function(s) { return s.challengeId !== challengeId; });
        renderCurrent();
        renderGrid();
    })
    .catch(function() {});
};

window.completeChallengeDay = function(challengeId) {
    var token = getToken();
    if (!token) return;
    fetch(API_BASE + '/challenges/complete-day', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ challengeId: challengeId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.error) { showToast('ERROR', data.error, 'error'); return; }
        if (data.subscription && data.subscription.completedAt) {
            document.getElementById('celebrateTitle').textContent = data.subscription.book + ' CHALLENGE COMPLETE';
            document.getElementById('celebrateDesc').textContent = 'You have finished the ' + data.subscription.book + ' challenge for ' + data.subscription.monthName + '. The Archive honors your discipline.';
            document.getElementById('celebrateOverlay').classList.add('show');
        }
        showToast('DAY COMPLETE', data.message, 'success');
        for (var i = 0; i < mySubscriptions.length; i++) {
            if (mySubscriptions[i].challengeId === challengeId) {
                mySubscriptions[i] = data.subscription; break;
            }
        }
        renderCurrent();
        renderGrid();
    })
    .catch(function() {});
};

loadAll();
})();
</script>
</body>
</html>
