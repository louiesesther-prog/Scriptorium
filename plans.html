.nav-links a:hover { color: rgba(212,175,55,0.1); }

.toast.toast-out { opacity: 0; transform: translateX(40px); }
.toast.toast-error { border-color: #b84a4a; color: #d48a8a; }

@media (max-width: 600px) { body { padding: 40px 0 60px 0; } .plans-grid { grid-template-columns: 1fr; } }

<script>
(function() {
var API_BASE = window.SCRIPTORIUM_API || '/api';
var plans = [];
var mySubscriptions = [];
var activeFilter = 'all';
var activeTrad = '';
var toastContainer = document.getElementById('toastContainer');
var plansGrid = document.getElementById('plansGrid');
var filterBar = document.getElementById('filterBar');
var tradFilterBar = document.getElementById('tradFilterBar');

var STATIC_PLANS = [
  {
    id: 'rv-1year', name: 'RECOVERY VERSION — ONE YEAR', category: 'testament',
    totalDays: 365, estimatedMinutes: 20,
    color: '#d4af37',
    description: 'Read the entire Bible in one year with the Recovery Version text and footnotes. Each day covers two to three chapters, alternating between the Old and New Testaments, with the Psalms and Proverbs woven throughout.',
    readings: []
  },
  {
    id: 'pauline-epistles', name: 'PAULINE EPISTLES — CANONICAL ORDER', category: 'section',
    totalDays: 30, estimatedMinutes: 15,
    color: '#8b5cf6',
    description: 'Journey through the Apostle Paul\'s thirteen epistles in canonical sequence. From Romans\' systematic theology to Philemon\'s personal appeal, trace the unfolding of the divine economy through the apostle of the Gentiles.',
    readings: []
  },
  {
    id: 'solomonic-wisdom', name: 'SOLOMONIC WISDOM LITERATURE', category: 'section',
    totalDays: 21, estimatedMinutes: 12,
    color: '#f59e0b',
    description: 'The three wisdom books attributed to Solomon: Proverbs\' practical instruction, Ecclesiastes\' existential reflection, and the Song of Songs\' poetic typology of Christ and the church.',
    readings: []
  },
  {
    id: 'prophetic-chronology', name: 'THE PROPHETS — CHRONOLOGICAL ORDER', category: 'section',
    totalDays: 60, estimatedMinutes: 18,
    color: '#ef4444',
    description: 'The Hebrew prophets arranged by their historical setting rather than canonical sequence. From eighth-century Hosea and Amos through post-exilic Zechariah and Malachi, hear the word of the Lord in its historical context.',
    readings: []
  }
];

function buildStaticReadings() {
  var otBooks = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  var ntBooks = ['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
  var allBooks = otBooks.concat(ntBooks);
  var chCount = {Genesis:50,Exodus:40,Leviticus:27,Numbers:36,Deuteronomy:34,Joshua:24,Judges:21,Ruth:4,'1 Samuel':31,'2 Samuel':24,'1 Kings':22,'2 Kings':25,'1 Chronicles':29,'2 Chronicles':36,Ezra:10,Nehemiah:13,Esther:10,Job:42,Psalms:150,Proverbs:31,Ecclesiastes:12,'Song of Solomon':8,Isaiah:66,Jeremiah:52,Lamentations:5,Ezekiel:48,Daniel:12,Hosea:14,Joel:3,Amos:9,Obadiah:1,Jonah:4,Micah:7,Nahum:3,Habakkuk:3,Zephaniah:3,Haggai:2,Zechariah:14,Malachi:4,Matthew:28,Mark:16,Luke:24,John:21,Acts:28,Romans:16,'1 Corinthians':16,'2 Corinthians':13,Galatians:6,Ephesians:6,Philippians:4,Colossians:4,'1 Thessalonians':5,'2 Thessalonians':3,'1 Timothy':6,'2 Timothy':4,Titus:3,Philemon:1,Hebrews:13,James:5,'1 Peter':5,'2 Peter':3,'1 John':5,'2 John':1,'3 John':1,Jude:1,Revelation:22};

  function isOT(b) { return otBooks.indexOf(b) !== -1; }
  function gallery(b) { return isOT(b) ? 'ot-gallery.html' : 'nt-gallery.html'; }
  function link(b,ch) { return gallery(b) + '?book=' + b.toLowerCase() + '&chapter=' + ch; }

  // RV 1-Year: 2-3 chapters/day through both testaments
  var rv = STATIC_PLANS[0].readings;
  var order = [];
  // Interleave: OT then NT in canonical order, spread across 365 days
  var otIdx = 0, ntIdx = 0;
  for (var d = 0; d < 365; d++) {
    var dayReadings = [];
    // 2 OT chapters on even days, 3 on odd
    var otCount = d % 2 === 0 ? 2 : 3;
    for (var i = 0; i < otCount && otIdx < allBooks.length; i++) {
      var book = allBooks[otIdx];
      dayReadings.push({ book: book, chapter: 1, link: link(book, 1), testament: isOT(book) ? 'OT' : 'NT' });
      otIdx++;
    }
    rv.push({ day: d + 1, readings: dayReadings });
  }

  // Pauline Epistles: Romans→Philemon, Hebrews optional = 13 books, ~30 days
  var pauline = ['Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon'];
  var pe = STATIC_PLANS[1].readings;
  var pDay = 0;
  pauline.forEach(function(b) {
    var c = chCount[b] || 1;
    var chsPerDay = Math.max(1, Math.round(c / 2));
    for (var ch = 1; ch <= c; ch += chsPerDay) {
      pDay++;
      pe.push({ day: pDay, readings: [{ book: b, chapter: ch, link: link(b, ch), testament: 'NT' }] });
    }
  });

  // Solomonic Wisdom: Proverbs, Ecclesiastes, Song of Solomon
  var sol = STATIC_PLANS[2].readings;
  ['Proverbs','Ecclesiastes','Song of Solomon'].forEach(function(b) {
    var c = chCount[b] || 1;
    for (var ch = 1; ch <= c; ch++) {
      sol.push({ day: sol.length + 1, readings: [{ book: b, chapter: ch, link: link(b, ch), testament: 'OT' }] });
    }
  });

  // Chronological Prophets
  var chrono = ['Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  var pr = STATIC_PLANS[3].readings;
  chrono.forEach(function(b) {
    var c = chCount[b] || 1;
    var step = Math.max(1, Math.round(c / 3));
    for (var ch = 1; ch <= c; ch += step) {
      pr.push({ day: pr.length + 1, readings: [{ book: b, chapter: ch, link: link(b, ch), testament: 'OT' }] });
    }
  });
}

function renderStaticPlan(p) {
  var totalDays = p.readings.length;
  var html = '<div class="plan-card">';
  html += '<div class="color-bar" style="background:' + p.color + ';"></div>';
  html += '<span class="category-tag">' + p.category.toUpperCase() + '</span>';
  html += '<h3>' + p.name + '</h3>';
  html += '<div class="meta">' + totalDays + ' days · ~' + p.estimatedMinutes + ' min/day</div>';
  html += '<div class="desc">' + p.description + '</div>';
  html += '<div class="stat"><span>📖 ' + totalDays + ' readings</span></div>';
  html += '<div class="actions">';
  html += '<button class="primary" onclick="window.__startStaticPlan(\'' + p.id + '\')">START READING</button>';
  html += '</div></div>';
  return html;
}

window.__startStaticPlan = function(id) {
  var plan = STATIC_PLANS.find(function(p) { return p.id === id; });
  if (!plan || !plan.readings.length) return;
  // Navigate to first reading
  var first = plan.readings[0];
  if (first && first.readings && first.readings[0]) {
    window.location.href = first.readings[0].link;
  }
};

buildStaticReadings();

function showToast(title, msg, type) {
  if (window.Scr && window.Scr.toast) { window.Scr.toast(title + ' | ' + msg, type); return; }
  var t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
  t.innerHTML = title + '<div style="font-family:\'Cormorant Garamond\',serif;font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:4px;">' + msg + '</div>';
  toastContainer.appendChild(t);
  setTimeout(function() { t.classList.add('toast-out'); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 5000);
}

function getToken() {
  return window.Scriptorium && window.Scriptorium.getToken ? window.Scriptorium.getToken() : null;
}

function fetchPlans() {
  var url = API_BASE + '/plans';
  var params = [];
  if (activeFilter !== 'all') params.push('category=' + activeFilter);
  if (activeTrad) params.push('tradition=' + activeTrad);
  if (params.length) url += '?' + params.join('&');
  return fetch(url).then(function(r) {
    if (!r.ok) throw new Error('Failed to fetch plans');
    return r.json();
  });
}

function fetchMyProgress() {
  var token = getToken();
  if (!token) return Promise.resolve([]);
  return fetch(API_BASE + '/plans/my/progress', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function(r) {
    if (!r.ok) return [];
    return r.json().then(function(d) { return d.subscriptions || []; });
  }).catch(function() { return []; });
}

function subscribe(planId) {
  var token = getToken();
  if (!token) { showToast('ARCHIVE SEALED', 'You must be a signed-in scribe to subscribe to a plan.', 'error'); return; }
  return fetch(API_BASE + '/plans/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ planId: planId })
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw e; });
    return r.json();
  }).then(function(d) {
    showToast('SUBSCRIBED', d.message || 'You have joined this reading plan.', 'success');
    return fetchMyProgress().then(function(subs) { mySubscriptions = subs; renderPlans(); });
  }).catch(function(err) {
    showToast('SUBSCRIPTION FAILED', err && err.error ? err.error : 'Could not subscribe.', 'error');
  });
}

function unsubscribe(planId) {
  var token = getToken();
  if (!token) return;
  fetch(API_BASE + '/plans/unsubscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ planId: planId })
  }).then(function(r) { return r.json(); }).then(function(d) {
    showToast('UNSUBSCRIBED', d.message || 'You have left this reading plan.', 'success');
    return fetchMyProgress().then(function(subs) { mySubscriptions = subs; renderPlans(); });
  }).catch(function() {});
}

function renderPlans() {
  var filtered = activeFilter === 'all' ? plans : plans.filter(function(p) { return p.category === activeFilter; });
  if (filtered.length === 0) {
    plansGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:\'Cormorant Garamond\',serif;color:var(--text-secondary);font-style:italic;">No plans found for this category.</div>';
    return;
  }
  var html = '';
  filtered.forEach(function(p) {
    var sub = mySubscriptions.find(function(s) { return s.planId === p.id; });
    var isSubscribed = !!sub;
    var isCompleted = sub && sub.completedAt;
    var progress = sub ? (sub.progress || 0) : 0;
    var truncatedDesc = p.description.length > 100 ? p.description.substring(0, 97) + '...' : p.description;
    html += '<div class="plan-card">';
    html += '<div class="color-bar" style="background:' + (p.color || '#666') + ';"></div>';
    html += '<span class="category-tag">' + (p.category || '').toUpperCase() + '</span>';
    if (isSubscribed) html += '<span class="badge ' + (isCompleted ? 'completed' : 'subscribed') + '">' + (isCompleted ? 'COMPLETED' : 'ACTIVE') + '</span>';
    html += '<h3>' + p.name + '</h3>';
    html += '<div class="meta">' + p.totalDays + ' days \u00B7 ~' + p.estimatedMinutes + ' min/day</div>';
    html += '<div class="desc">' + truncatedDesc + '</div>';
    html += '<div class="stat"><span>\u{1F4D6} ' + p.totalDays + ' readings</span></div>';
    html += '<div class="actions">';
    if (isSubscribed) {
      if (isCompleted) {
        html += '<button disabled>COMPLETED</button>';
      } else {
        html += '<button onclick="window.__plans_unsubscribe(\'' + p.id + '\')">SUSPEND</button>';
        html += '<button class="primary" disabled>\u2713 SUBSCRIBED</button>';
      }
    } else {
      html += '<button class="primary" onclick="window.__plans_subscribe(\'' + p.id + '\')">SUBSCRIBE</button>';
    }
    html += '</div>';
    if (isSubscribed && !isCompleted) {
      html += '<div class="progress-mini"><div class="fill" style="width:' + progress + '%;"></div></div>';
    }
    if (isSubscribed && isCompleted) {
      html += '<div class="progress-mini"><div class="fill done" style="width:100%;"></div></div>';
    }
    html += '</div>';
  });
  plansGrid.innerHTML = html;
}

window.__plans_subscribe = subscribe;
window.__plans_unsubscribe = unsubscribe;

filterBar.addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn || !btn.dataset.filter) return;
  filterBar.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  if (plans.length > 0) {
    renderPlans();
  } else {
    renderStaticPlans();
  }
});

function renderStaticPlans() {
  var filtered = activeFilter === 'all' ? STATIC_PLANS : STATIC_PLANS.filter(function(p) { return p.category === activeFilter; });
  if (filtered.length === 0) {
    plansGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:\'Cormorant Garamond\',serif;color:var(--text-secondary);font-style:italic;">No plans found for this category.</div>';
    return;
  }
  var html = '';
  filtered.forEach(function(p) { html += renderStaticPlan(p); });
  plansGrid.innerHTML = html;
}

function init() {
  fetchMyProgress().then(function(subs) {
    mySubscriptions = subs;
    return fetchPlans();
  }).then(function(data) {
    plans = data.plans || [];
    renderPlans();
  }).catch(function(err) {
    renderStaticPlans();
  });
}

// ── Tradition filter ──
(function loadTradFilters() {
  fetch('/api/traditions').then(function(r) { return r.json(); }).then(function(d) {
    if (d && d.traditions) {
      d.traditions.forEach(function(t) {
        var btn = document.createElement('button');
        btn.dataset.trad = t.id;
        btn.textContent = t.label.replace(/ \/.*/, ''); // short label
        tradFilterBar.appendChild(btn);
      });
      // Auto-select user's tradition
      var token = getToken();
      if (token) {
        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d && d.scribe && d.scribe.tradition) {
              var btns = tradFilterBar.querySelectorAll('[data-trad]');
              for (var i = 0; i < btns.length; i++) {
                if (btns[i].dataset.trad === d.scribe.tradition) {
                  tradFilterBar.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
                  btns[i].classList.add('active');
                  activeTrad = d.scribe.tradition;
                  if (plans.length > 0) renderPlans();
                  break;
                }
              }
            }
          }).catch(function() {});
      }
    }
  }).catch(function() {});
})();

tradFilterBar.addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn || !btn.dataset.trad === undefined) return;
  tradFilterBar.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  activeTrad = btn.dataset.trad;
  if (plans.length > 0) {
    renderPlans();
  } else {
    renderStaticPlans();
  }
});

init();
})();
</script>
</body>
</html>
