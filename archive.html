<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRIPTORIUM | THE ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;background:#050505;color:rgba(255,255,255,0.95);font-family:'Cinzel',serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;animation:fadeIn 1.5s ease both;padding-left:80px}@keyframes fadeIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}.card{text-align:center;max-width:480px;padding:60px 48px;background:rgba(10,10,10,0.9);border:1px solid rgba(212,175,55,0.85);border-radius:4px;box-shadow:0 0 80px rgba(0,0,0,0.95)}.icon{font-size: 3rem;color:#d4af37;opacity:0.4;margin-bottom:8px}h1{font-size: 0.66rem;letter-spacing:6px;color:#d4af37;margin:0 0 12px}.subtitle{font-family:'Cormorant Garamond',serif;font-size: 0.66rem;font-style:italic;color:rgba(255,255,255,0.45);margin:0 0 28px}.desc{font-family:'Cormorant Garamond',serif;font-size: 0.66rem;color:rgba(255,255,255,0.45);margin:0 0 32px;line-height:1.6}a{display:inline-block;border:1px solid rgba(212,175,55,0.17);color:rgba(212,175,55,0.3);padding:10px 28px;text-decoration:none;font-size: 0.54rem;letter-spacing:3px;transition:all 0.3s;border-radius:3px}a:hover{border-color:#d4af37;color:#d4af37}
        .museum-sidebar { position:fixed;left:0;top:0;bottom:0;width:80px;background:#080808;border-right:1px solid rgba(212,175,55,0.2);z-index:2000;display:flex;flex-direction:column;align-items:center;padding:0; }
        .sidebar-nav { flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px; }
        .nav-link { position:relative;display:flex;align-items:center;justify-content:center;width:50px;height:50px;color:rgba(255,255,255,0.98);text-decoration:none;border:1px solid transparent;border-radius:6px;font-size: 24px;transition:all 0.25s; }
        .nav-link:hover { color:#d4af37;border-color:rgba(212,175,55,0.2);background:rgba(212,175,55,0.17); }
        .nav-link::after { content: attr(title);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:#111;border:1px solid rgba(212,175,55,0.2);color:#d4af37;font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:2px;white-space:nowrap;padding:5px 10px;pointer-events:none;opacity:0;transition:opacity 0.2s ease;z-index:9999; }
        .nav-link:hover::after { opacity: 1; }
        .nav-link.active { color:#d4af37;border-color:rgba(212,175,55,0.3);background:rgba(212,175,55,0.08); }
        .sidebar-rank { width:100%;padding:10px 0 12px;font-size: 0.66rem;letter-spacing:1.5px;color:#d4af37;text-align:center;line-height:1.6;opacity:0.85;border-top:1px solid rgba(212,175,55,0.2);flex-shrink:0; }
        .nav-divider { width:28px;height:1px;background:rgba(212,175,55,0.2);flex-shrink:0;margin:4px 0; }
        .sidebar-logo { width:100%;padding:14px 0 12px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(212,175,55,0.2);flex-shrink:0; }
        .sidebar-logo svg { width:28px;height:28px;opacity:0.85; }
</style>
    <script src="assets/js/sidebar.js"></script>
</head>
<body>
<div id="sidebarContainer"></div>
<div class="card">
<div class="icon">&#128214;</div>
<h1>THE ARCHIVE</h1>
<p class="subtitle">Cataloguing the eternal record</p>
<p class="desc">The vast halls of the Scriptorium Archive are still being inventoried. Scrolls are being catalogued. Return soon to browse the complete collection.</p>
<a href="scriptorium.html">&larr; RETURN TO THE THRESHOLD</a>
</div>
</body>
</html>
