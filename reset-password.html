<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta property="og:title" content="SCRIPTORIUM | Reset Password">
    <meta name="description" content="Scriptorium — a digital archive of biblical texts, maps, genealogies, and manuscript studies.">
    <meta property="og:description" content="Scriptorium — a digital archive of biblical texts, maps, genealogies, and manuscript studies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://scriptorium-sandy.vercel.app/reset-password.html">
    <meta property="og:image" content="https://scriptorium-sandy.vercel.app/og-image.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Cipher Key — Scriptorium</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://bible-api.com https://api.scripture.api.bible; img-src 'self' data: *.tile.openstreetmap.org *.basemaps.cartocdn.com upload.wikimedia.org; frame-src 'none';">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#e0e0e0;font-family:'Cormorant Garamond',serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{text-align:center;max-width:400px;padding:40px}
h1{font-family:'Cinzel',serif;font-size:1.2rem;letter-spacing:6px;color:#d4af37;font-weight:400;margin:0 0 8px}
.subtitle{font-size: var(--text-micro);letter-spacing:4px;color:rgba(212,175,55,0.15);margin-bottom:24px}
p{font-size:0.85rem;color:rgba(255,255,255,0.4);line-height:1.6;margin:0 0 20px}
input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(212,175,55,0.08);color:rgba(255,255,255,0.98);font-family:'Cormorant Garamond',serif;font-size:0.85rem;padding:8px 2px;outline:none;margin-bottom:16px;text-align:center}
input:focus{border-color:rgba(212,175,55,0.3)}
button{background:transparent;border:1px solid rgba(212,175,55,0.15);color:#d4af37;padding:10px 28px;font-family:'Cinzel',serif;font-size: var(--text-micro);letter-spacing:3px;cursor:pointer;border-radius:2px;transition:0.3s;margin-top:8px}
button:hover{border-color:#d4af37;background:rgba(212,175,55,0.05)}
button:disabled{opacity:0.3;cursor:not-allowed}
.error{color:#c44;font-size:0.75rem;margin-top:12px;min-height:1.2em}
.success{color:#4caf50;font-size:0.75rem;margin-top:12px;min-height:1.2em}
.hint{font-size:0.65rem;color: var(--text-secondary);margin:-8px 0 16px}
</style>
</head>
<body>
<div class="container">
<h1>REFORGE CIPHER</h1>
<div class="subtitle">Reset Your Cipher Key</div>
<p>Enter a new Cipher Key to restore access to the Archive.</p>
<input type="password" id="newPassword" placeholder="New Cipher Key (8+ chars, 1 number, 1 special char)">
<div class="hint">At least 8 characters, 1 number, 1 special character</div>
<button id="resetBtn" onclick="submitReset()">FORGE NEW KEY</button>
<div id="msg" class="error"></div>
</div>
<script>
var token = new URLSearchParams(window.location.search).get('token');
if (!token) { document.getElementById('msg').textContent = 'Invalid or missing reset token.'; document.getElementById('resetBtn').disabled = true; }

async function submitReset() {
var pass = document.getElementById('newPassword').value.trim();
var msg = document.getElementById('msg');
var btn = document.getElementById('resetBtn');
if (!/^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}$/.test(pass)) { msg.textContent = 'Does not meet strength requirements.'; return; }
msg.textContent = ''; btn.disabled = true; btn.textContent = 'FORGING...';
try {
var res = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ resetToken: token, newPassword: pass }) });
var data = await res.json();
if (!res.ok) throw data;
msg.className = 'success'; msg.textContent = data.message || 'Cipher Key reforged.';
btn.textContent = 'REDIRECTING...';
setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
} catch(e) { msg.className = 'error'; msg.textContent = e.error || 'Failed to reset.'; btn.disabled = false; btn.textContent = 'FORGE NEW KEY'; }
}
</script>
</body>
</html>
