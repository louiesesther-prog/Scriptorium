name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: scriptorium-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scriptorium-api

      - name: Lint — syntax check all JS files
        run: |
          echo "Checking server entry…"
          node -c scriptorium-api/server.js
          echo "Checking app routes…"
          node -c scriptorium-api/app.js
          echo "Checking email module…"
          node -c scriptorium-api/email.js
          echo "Checking plans data…"
          node -c scriptorium-api/plans-data.js
          echo "Checking challenges data…"
          node -c scriptorium-api/challenges-data.js

      - name: Lint — client JS syntax checks
        run: |
          node -c assets/js/auth.js
          node -c assets/js/sidebar.js
          node -c assets/js/scriptorium-core.js
          node -c assets/js/map-data.js
          node -c sw.js

      - name: Run API integration tests
        run: node test.js
        working-directory: scriptorium-api
        env:
          JWT_SECRET: ci-test-secret-key

      - name: Install root dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test --workers=2
        env:
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

      - name: Run regression tests
        run: node tests/regression.js
        env:
          JWT_SECRET: ci-test-secret-key
          NODE_ENV: test

  lighthouse:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm ci
        working-directory: scriptorium-api

      - name: Install @lhci/cli globally
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci-reports/
