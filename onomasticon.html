<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTORIUM | The Onomasticon</title>

    <meta name="description" content="A biographical dictionary of biblical figures — names, meanings, and life accounts from Scripture.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23d4af37' font-family='serif'%3ES%3C/text%3E%3C/svg%3E">
    <link href="assets/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <link rel="stylesheet" href="assets/css/features.css">
    <link rel="manifest" href="/manifest.json">
    <script defer src="assets/js/auth.js"></script>
    <script defer src="assets/js/sidebar.js"></script>
    <script defer src="assets/js/onomasticon-page.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-subtle: rgba(212,175,55,0.85); --text-light: rgba(255,255,255,0.95); --text-dim: rgba(255,255,255,0.98); }

        .onomasticon-wrapper {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            padding-left: 80px;
            gap: 0;
        }

        /* Left Side: Name Registry */
        .registry-sidebar {
            background: #080808;
            border-right: 1px solid var(--gold-subtle);
            padding: 20px 16px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #nameListContainer {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-bottom: 20px;
        }
        .registry-header {
            font-family: 'Cinzel', serif;
            font-size: 1.02rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 24px;
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gold-subtle);
            opacity: 0.85;
        }
        .registry-section {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin: 20px 0 8px;
            padding-left: 8px;
        }
        .name-row {
            padding: 12px 16px;
            border: 1px solid transparent;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.98);
            border-radius: 3px;
        }
        .name-row:hover { background: rgba(212,175,55,0.03); border-color: rgba(212,175,55,0.85); color: var(--gold); }
        .name-row.active { background: rgba(212,175,55,0.06); border-color: rgba(212,175,55,0.3); color: var(--gold); }

        /* --- FIXED DATA VIEWPORT SPLIT ENGINE --- */

        /* Right container wrapper fills remaining screen cleanly without overflowing */
        .meaning-canvas {
            padding: 40px;
            background: radial-gradient(circle at 50% 30%, #0e0c0b 0%, #030303 100%);
            overflow: hidden; /* Lock the main window container frame tight */
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The actual interactive data sheet split card */
        .vellum-sheet {
            display: flex; /* Force side-by-side split row structure */
            flex-direction: row;
            width: 100%;
            height: 100%; /* Force it to take exactly available viewport height */
            max-height: calc(100vh - 80px); /* Account for padding constraints */
            background: rgba(10, 8, 7, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 4px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* LEFT HALF: Pinned Image Frame */
        .onom-image-frame {
            flex: 1.2;
            max-width: 55%;
            height: 100%;
            background: #000;
            border-right: none;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .onom-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops picture natively to bounds without distortion */
        }

        .onom-image-placeholder {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212,175,55,0.4);
        }

        /* RIGHT HALF: Independent Scrolling Text Context Panel */
        .onom-text-frame {
            flex: 0.9;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Glyphs displayed inline inside the text frame */
        .hebrew-glyph {
            font-size: 2.2rem;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            text-align: center;
            margin-bottom: 28px;
            text-shadow: 0 0 10px rgba(212,175,55,0.6), 0 0 30px rgba(212,175,55,0.3);
        }
        .geez-glyph {
            display: none;
        }

        /* Clean styling spacing adjustments for data sections */
        .meaning-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
        }

        .phonetic-sub {
            font-style: italic;
            color: rgba(255,255,255,0.4);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .data-segment {
            margin-bottom: 25px;
        }

        .data-segment h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--gold-subtle);
            margin: 0 0 8px 0;
        }

        .data-segment p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin: 0;
        }
        .vellum-sheet::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-left: 1px solid var(--gold-subtle);
            border-right: 1px solid var(--gold-subtle);
            pointer-events: none;
        }
        .onom-image-box {
            width: 100%;
            height: 280px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--gold-subtle);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16120e;
        }
        .onom-image-box img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .onom-image-placeholder {
            font-size: 76.8px;
            opacity: 0.15;
            color: var(--gold);
            line-height: 280px;
        }
        .meaning-title {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: #fff;
            margin: 0;
        }
        .phonetic-sub {
            text-align: center;
            font-style: italic;
            color: var(--gold);
            font-size: 1rem;
            margin-top: 4px;
            margin-bottom: 24px;
            opacity: 0.85;
        }
        .data-segment { margin-bottom: 24px; animation: segmentFadeIn 0.5s ease both; }
        .data-segment:nth-child(2) { animation-delay: 0.05s; }
        .data-segment:nth-child(3) { animation-delay: 0.1s; }
        .data-segment:nth-child(4) { animation-delay: 0.15s; }
        .data-segment:nth-child(5) { animation-delay: 0.2s; }
        @keyframes segmentFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .data-segment h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.96rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.98);
            margin: 0 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(212,175,55,0.06);
        }
        .data-segment p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 8px 0 0;
            color: rgba(255,255,255,0.95);
        }
        .data-segment .alliance-text {
            color: var(--gold);
            font-size: 1.26rem;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
            background: rgba(212,175,55,0.05);
            border-left: 3px solid var(--gold);
            padding: 12px 18px;
            text-shadow: 0 0 10px rgba(212,175,55,0.1);
        }
        .locate-on-map-btn {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold);
            background: rgba(212,175,55,0.08);
            border: 1px solid var(--gold-subtle);
            padding: 10px 20px;
            border-radius: 3px;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }
        .locate-on-map-btn:hover {
            background: rgba(212,175,55,0.18);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212,175,55,0.15);
        }
        .codex-placeholder {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: rgba(255,255,255,0.45);
            font-size: 1.02rem;
            letter-spacing: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }
        .museum-search-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-subtle);
            padding: 12px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.96rem;
            letter-spacing: 1px;
            color: var(--text-light);
            outline: none;
            margin-bottom: 16px;
            border-radius: 3px;
        }
        .museum-search-input:focus { border-color: var(--gold); }
        .filter-badge-row {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            font-size: var(--text-micro);
        }
        .filter-badge-row {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            font-size: var(--text-micro);
            letter-spacing: 1px;
            padding: 8px 4px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 3px;
        }
        .filter-badge:hover { border-color: var(--gold); color: var(--gold); }
        .filter-badge.active { background: rgba(212,175,55,0.1); border-color: var(--gold); color: var(--gold); }

        /* Responsive */
        @media (max-width: 768px) {
            .onomasticon-wrapper { grid-template-columns: 1fr; height: auto; padding-left: 0; margin-top: 80px; }
            .registry-sidebar { height: 300px; }
        }
    </style>
</head>
<body>
<div id="sidebarContainer"></div>

<div class="onomasticon-wrapper">
    <aside class="registry-sidebar">
        <div class="registry-header">REGISTRY OF THE COVENANT</div>
        <input type="text" id="onomasticonSearch" placeholder="SEARCH CODENAME..." oninput="filterRegistry()" class="museum-search-input">
        <div class="filter-badge-row">
            <button class="filter-badge active" data-category="all">ALL</button>
            <button class="filter-badge" data-category="tribes">TRIBES</button>
            <button class="filter-badge" data-category="patriarchs">PATRIARCHS</button>
            <button class="filter-badge" data-category="royalProphetic">ROYAL &amp; PROPHETIC</button>
            <button class="filter-badge" data-category="apostolic">APOSTOLIC</button>
        </div>
        <div id="nameListContainer"></div>
    </aside>
    <main class="meaning-canvas">
        <div class="vellum-sheet" id="activeMeaningSheet">
            <div class="codex-placeholder">✦ SELECT A RECORD TO UNSEAL ✦</div>
        </div>
    </main>
</div>

<script defer src="assets/js/scriptorium-core.js"></script>
<script defer src="assets/js/features.js"></script>
<div id="narthex-transition-curtain" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;pointer-events:none;opacity:0;transition:opacity 0.6s ease;"></div>
</body>
</html>
