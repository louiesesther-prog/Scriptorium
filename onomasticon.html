<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTORIUM | The Onomasticon</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <script src="assets/js/sidebar.js"></script>
    <style>
        :root { --gold: #d4af37; --gold-subtle: rgba(212,175,55,0.85); --text-light: rgba(255,255,255,0.95); --text-dim: rgba(255,255,255,0.98); }

        .onomasticon-wrapper {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            padding-left: 0;
            gap: 0;
        }

        /* Left Side: Name Registry */
        .registry-sidebar {
            background: #080808;
            border-right: 1px solid var(--gold-subtle);
            padding: 20px 16px;
            height: calc(100vh - 160px); /* Match the meaning canvas height */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .registry-header {
            font-family: 'Cinzel', serif;
            font-size: 1.02rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 24px;
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gold-subtle);
            opacity: 0.85;
        }
        .registry-section {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.3);
            margin: 20px 0 8px;
            padding-left: 8px;
        }
        .name-row {
            padding: 12px 16px;
            border: 1px solid transparent;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            font-size: 1.14rem;
            color: rgba(255,255,255,0.98);
            border-radius: 3px;
        }
        .name-row:hover { background: rgba(212,175,55,0.03); border-color: rgba(212,175,55,0.85); color: var(--gold); }
        .name-row.active { background: rgba(212,175,55,0.06); border-color: rgba(212,175,55,0.3); color: var(--gold); }

        /* --- FIXED DATA VIEWPORT SPLIT ENGINE --- */

        /* Right container wrapper fills remaining screen cleanly without overflowing */
        .meaning-canvas {
            padding: 40px;
            background: radial-gradient(circle at 50% 30%, #0e0c0b 0%, #030303 100%);
            overflow: hidden; /* Lock the main window container frame tight */
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The actual interactive data sheet split card */
        .vellum-sheet {
            display: flex; /* Force side-by-side split row structure */
            flex-direction: row;
            width: 100%;
            height: 100%; /* Force it to take exactly available viewport height */
            max-height: calc(100vh - 80px); /* Account for padding constraints */
            background: rgba(10, 8, 7, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 4px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        /* LEFT HALF: Pinned Image Frame */
        .onom-image-frame {
            flex: 1; /* Takes up exactly 45% to 50% of screen row space */
            max-width: 45%;
            height: 100%;
            background: #000;
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .onom-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Crops picture natively to bounds without distortion */
        }

        .onom-image-placeholder {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212,175,55,0.4);
        }

        /* RIGHT HALF: Independent Scrolling Text Context Panel */
        .onom-text-frame {
            flex: 1.2;
            height: 100%;
            padding: 45px;
            overflow-y: auto; /* CRITICAL: Creates a scrollbar ONLY inside this text tray! */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Adjust your glyph overlays to float neatly inside the layout */
        .hebrew-glyph {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 4rem;
            color: rgba(212, 175, 55, 0.05); /* Ghost background aesthetic watermark */
            font-family: 'Cinzel', serif;
            pointer-events: none;
        }

        .geez-glyph {
            position: absolute;
            top: 80px;
            right: 20px;
            font-size: 3rem;
            color: rgba(212, 175, 55, 0.03);
            pointer-events: none;
        }

        /* Clean styling spacing adjustments for data sections */
        .meaning-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin: 0 0 5px 0;
        }

        .phonetic-sub {
            font-style: italic;
            color: rgba(255,255,255,0.4);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .data-segment {
            margin-bottom: 25px;
        }

        .data-segment h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--gold-subtle);
            margin: 0 0 8px 0;
        }

        .data-segment p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin: 0;
        }
        .vellum-sheet::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-left: 1px solid var(--gold-subtle);
            border-right: 1px solid var(--gold-subtle);
            pointer-events: none;
        }
        .onom-image-box {
            width: 100%;
            height: 280px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--gold-subtle);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16120e;
        }
        .onom-image-box img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .onom-image-placeholder {
            font-size: 76.8px;
            opacity: 0.15;
            color: var(--gold);
            line-height: 280px;
        }
        .hebrew-glyph {
            font-size: 5.4rem;
            text-align: center;
            color: rgba(255,255,255,0.45);
            text-shadow: 0 0 30px rgba(212,175,55,0.04);
            margin-bottom: 4px;
        }
        .geez-glyph {
            font-size: 3.84rem;
            text-align: center;
            color: rgba(212,175,55,0.4);
            margin-bottom: 2px;
            letter-spacing: 2px;
        }
        .meaning-title {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 2.52rem;
            letter-spacing: 4px;
            color: #fff;
            margin: 0;
        }
        .phonetic-sub {
            text-align: center;
            font-style: italic;
            color: var(--gold);
            font-size: 1.38rem;
            margin-top: 4px;
            margin-bottom: 40px;
            opacity: 0.85;
        }
        .data-segment { margin-bottom: 24px; animation: segmentFadeIn 0.5s ease both; }
        .data-segment:nth-child(2) { animation-delay: 0.05s; }
        .data-segment:nth-child(3) { animation-delay: 0.1s; }
        .data-segment:nth-child(4) { animation-delay: 0.15s; }
        .data-segment:nth-child(5) { animation-delay: 0.2s; }
        @keyframes segmentFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .data-segment h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.96rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.98);
            margin: 0 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(212,175,55,0.06);
        }
        .data-segment p {
            font-size: 1.5rem;
            line-height: 1.7;
            margin: 8px 0 0;
            color: rgba(255,255,255,0.95);
        }
        .data-segment .alliance-text {
            color: var(--gold);
            font-size: 1.26rem;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
            background: rgba(212,175,55,0.05);
            border-left: 3px solid var(--gold);
            padding: 12px 18px;
            text-shadow: 0 0 10px rgba(212,175,55,0.1);
        }
        .codex-placeholder {
            text-align: center;
            font-family: 'Cinzel', serif;
            color: rgba(255,255,255,0.45);
            font-size: 1.02rem;
            letter-spacing: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }
        .museum-search-input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--gold-subtle);
            padding: 12px 16px;
            font-family: 'Cinzel', serif;
            font-size: 0.96rem;
            letter-spacing: 1px;
            color: var(--text-light);
            outline: none;
            margin-bottom: 16px;
            border-radius: 3px;
        }
        .museum-search-input:focus { border-color: var(--gold); }
        .filter-badge-row {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }
        .filter-badge {
            flex: 1;
            background: transparent;
            border: 1px solid var(--gold-subtle);
            color: rgba(255,255,255,0.4);
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 8px 4px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 3px;
        }
        .filter-badge:hover { border-color: var(--gold); color: var(--gold); }
        .filter-badge.active { background: rgba(212,175,55,0.1); border-color: var(--gold); color: var(--gold); }

        /* Responsive */
        @media (max-width: 768px) {
            .onomasticon-wrapper { grid-template-columns: 1fr; height: auto; padding-left: 0; margin-top: 80px; }
            .registry-sidebar { height: 300px; }
        }
    </style>
</head>
<body>
<div id="sidebarContainer"></div>

<div class="onomasticon-wrapper">
    <aside class="registry-sidebar">
        <div class="registry-header">REGISTRY OF THE COVENANT</div>
        <input type="text" id="onomasticonSearch" placeholder="SEARCH CODENAME..." oninput="filterRegistry()" class="museum-search-input">
        <div class="filter-badge-row">
            <button class="filter-badge active" data-category="all">ALL</button>
            <button class="filter-badge" data-category="tribes">TRIBES</button>
            <button class="filter-badge" data-category="patriarchs">PATRIARCHS</button>
            <button class="filter-badge" data-category="royalProphetic">ROYAL &amp; PROPHETIC</button>
            <button class="filter-badge" data-category="apostolic">APOSTOLIC</button>
        </div>
        <div id="nameListContainer"></div>
    </aside>
    <main class="meaning-canvas">
        <div class="vellum-sheet" id="activeMeaningSheet">
            <div class="codex-placeholder">✦ SELECT A RECORD TO UNSEAL ✦</div>
        </div>
    </main>
</div>

<script>
    const SCRIPTORIUM_ONOMASTICON = {
        // === THE TWELVE TRIBES OF ISRAEL ===
        "reuben": {
            hebrew: "רְאוּבֵן", geez: "ሮቤል", phonetic: "Re'uven",
            meaning: "Behold, a Son!",
            historicalContext: "Exclaimed by Leah upon his birth: 'Because the LORD has looked upon my affliction' (Genesis 29:32). The firstborn who forfeited his preeminence due to instability.",
            alliance: "Vanguard of the Southern Camp (Flag of the Man)", category: "tribe"
        },
        "simeon": {
            hebrew: "שִׁמְעוֹן", geez: "ስምዖን", phonetic: "Shim'on",
            meaning: "Heard / One Who Hears",
            historicalContext: "Named by Leah to signify that 'the LORD has heard that I am hated' (Genesis 29:33). Known for a volatile, fierce zeal that led to scattered territories.",
            alliance: "Flank of the Southern Camp", category: "tribe"
        },
        "levi": {
            hebrew: "לֵוִי", geez: "ሌዊ", phonetic: "Lewi",
            meaning: "Attached / Joined",
            historicalContext: "Signified Leah's hope that her husband would become intimately attached to her. His lineage was set apart as the priestly class to guard the Tabernacle ark.",
            alliance: "Keepers of the Inner Court (Encamped Centrally)", category: "tribe"
        },
        "judah": {
            hebrew: "יְהוּדָה", geez: "ይሁዳ", phonetic: "Yehudah",
            meaning: "Praised / Thanksgiving",
            historicalContext: "Named by Leah: 'This time I will praise the LORD' (Genesis 29:35). Prophesied as the royal lineage of the Lion, the scepter holder, and the line of David.",
            alliance: "Vanguard of the Eastern Camp (Flag of the Lion)", category: "tribe"
        },
        "dan": {
            hebrew: "דָּן", geez: "ዳን", phonetic: "Dan",
            meaning: "Judge / Vindicator",
            historicalContext: "Named by Rachel via Bilhah: 'God has judged me... and given me a son' (Genesis 30:6). Prophesied to judge his people as a serpent along the trail.",
            alliance: "Vanguard of the Northern Camp (Flag of the Eagle)", category: "tribe"
        },
        "naphtali": {
            hebrew: "נַפְתָּלִי", geez: "ናፍታሌ", phonetic: "Naftali",
            meaning: "My Wrestling",
            historicalContext: "Named by Rachel to signify her spiritual rivalry: 'With mighty wrestlings have I wrestled... and prevailed' (Genesis 30:8). Characterized as a doe let loose.",

        "gad": {
            hebrew: "גָּד", geez: "ጋድ", phonetic: "Gad",
            meaning: "A Troop Comes / Fortune",
            historicalContext: "Named by Leah via Zilpah, declaring, 'Fortune comes!' (Genesis 30:11). Prophesied by Jacob to be raided by marauders but overcoming them at the heel.",
            alliance: "Flank of the Southern Camp", category: "tribe"
        },
        "asher": {
            hebrew: "אָשֵׁר", geez: "አሴር", phonetic: "Asher",
            meaning: "Happy / Blessed",
            historicalContext: "Named by Leah via Zilpah: 'Happy am I! For the daughters will call me happy' (Genesis 30:13). Noted for fertile, rich borders yielding royal delicacies.",
            alliance: "Flank of the Northern Camp", category: "tribe"
        },
        "issachar": {
            hebrew: "יִשָּׂשכָר", geez: "ይሳኮር", phonetic: "Yissakhar",
            meaning: "There is a Reward / Man of Hire",
            historicalContext: "Named when Leah stated, 'God has given me my hire' (Genesis 30:18). Renowned as men who understood the seasons and knew what paths Israel should take.",

        },
        "zebulun": {
            hebrew: "זְבוּלֻן", geez: "ዛብሎን", phonetic: "Zevulun",
            meaning: "Dwelling / Honor",
            historicalContext: "Named when Leah rejoiced, 'Now will my husband dwell with me' (Genesis 30:20). Destined to settle by the coastlines as a strategic haven for ships.",
            alliance: "Flank of the Eastern Camp", category: "tribe"
        },
        "joseph": {
            hebrew: "יוֹסֵף", geez: "ዮሴፍ", phonetic: "Yosef",
            meaning: "May He Add / Increaser",
            historicalContext: "Named by Rachel after long barrenness: 'The LORD will add to me another son' (Genesis 30:24). Divided into the two dominant tribes of Ephraim and Manasseh.",

        },
        "benjamin": {

            meaning: "Son of the Right Hand",

            alliance: "Guardians of the Sanctuary West", category: "tribe"
        },

        // === COVENANT PATRIARCHS & MATRIARCHS ===
        "abraham": {
            hebrew: "אַבְרָהָם", geez: "አብርሃም", phonetic: "Avraham",
            meaning: "Father of a Multitude",
            historicalContext: "Originally Abram ('Exalted Father'), he was renamed by God to seal the eternal covenant promising that he would become the progenitor of many nations (Genesis 17:5).",

        "isaac": {

        "jacob": {

        },

        },
        "noah": {
            hebrew: "נֹחַ", geez: "ኖህ", phonetic: "Noach",
            meaning: "Rest / Comfort",

        },

        // === ROYAL COURT, PROPHETS & HEROES ===

            hebrew: "דָּוִד", geez: "ዳዊት", phonetic: "Dawid",
            meaning: "Beloved One",
            historicalContext: "The shepherd king anointed by Samuel. He established Jerusalem as the capital, brought the Ark to Zion, and received the unconditional promise of an everlasting kingdom.",

        },
        "solomon": {

            meaning: "Peaceful / Peaceable",
            historicalContext: "The son of David and Bathsheba who inherited the throne and built the First Temple. Renowned for unequaled wisdom, he composed Proverbs, Ecclesiastes, and the Song of Songs.",
            alliance: "The Wise King", category: "royal"
        },
        "esther": {

            historicalContext: "Originally Hadassah ('Myrtle'), she adopted the Persian name Esther to conceal her Jewish identity in Susa. She bravely risked execution to intercept Haman's plot, declaring, 'If I perish, I perish' (Esther 4:16).",

        "abigail": {

        },
        "zerubbabel": {

        },
        "nehemiah": {

        },
        "elijah": {

        },
        "elisha": {

    var currentCategory = 'all';
    var CATEGORY_MAP = {
        all: function() { return true; },
        tribes: function(r) { return r.category === 'tribe'; },
        patriarchs: function(r) { return ['patriarch','matriarch'].indexOf(r.category) !== -1; },
        royalProphetic: function(r) { return ['royal','prophet','judge','hero','scribe'].indexOf(r.category) !== -1; },
        apostolic: function(r) { return ['apostle','messiah','disciple'].indexOf(r.category) !== -1; }
    };

    window.filterRegistry = function() {
        var query = document.getElementById('onomasticonSearch').value.toLowerCase();
        var rows = document.querySelectorAll('.name-row');
        var fn = CATEGORY_MAP[currentCategory] || CATEGORY_MAP.all;

        rows.forEach(function(row) {
            var name = row.innerText.toLowerCase();
            var key = row.getAttribute('data-key');
            var record = SCRIPTORIUM_ONOMASTICON[key];
            var categoryMatch = fn(record);

            if (name.indexOf(query) !== -1 && categoryMatch) {
                row.style.display = 'block';
            } else {
                row.style.display = 'none';
            }
        });
    };

    window.setRegistryCategory = function(cat) {
        document.querySelectorAll('.filter-badge').forEach(function(b) { b.classList.remove('active'); });
        event.target.classList.add('active');
        currentCategory = cat;
        window.filterRegistry();
    };

    // Event delegation for filter badges
    document.querySelector('.filter-badge-row').addEventListener('click', function(e) {
        if (e.target.classList.contains('filter-badge')) {
            const category = e.target.getAttribute('data-category');
            window.setRegistryCategory(category);
        }
    });

    function renderRegistryList() {
        var container = document.getElementById('nameListContainer');
        if (!container) return;

        Object.keys(SCRIPTORIUM_ONOMASTICON).forEach(function(key) {
            var row = document.createElement('div');
            row.className = 'name-row';
            row.setAttribute('data-key', key);
            row.innerText = key.toUpperCase().replace(/-/g, ' ');
            row.onclick = function() { reveal(key, row); };
            container.appendChild(row);
        });
    }

    renderRegistryList();

    var params = new URLSearchParams(window.location.search);
    var focus = params.get('focus');
    if (focus && SCRIPTORIUM_ONOMASTICON[focus]) {
        var target = document.querySelector('.name-row[data-key="' + focus + '"]');
        if (target) {
            reveal(focus, target);
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function renderRegistryList() {
        var container = document.getElementById('nameListContainer');
        if (!container) return;

        Object.keys(SCRIPTORIUM_ONOMASTICON).forEach(function(key) {
            var row = document.createElement('div');
            row.className = 'name-row';
            row.setAttribute('data-key', key);
            row.innerText = key.toUpperCase().replace(/-/g, ' ');
            row.onclick = function() { reveal(key, row); };
            container.appendChild(row);
        });
    }

    renderRegistryList();

    var params = new URLSearchParams(window.location.search);
    var focus = params.get('focus');
    if (focus && SCRIPTORIUM_ONOMASTICON[focus]) {
        var target = document.querySelector('.name-row[data-key="' + focus + '"]');
        if (target) {
            reveal(focus, target);
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function reveal(key, element) {
        document.querySelectorAll('.name-row').forEach(function(r) { r.classList.remove('active'); });
        if (element) element.classList.add('active');

        var record = SCRIPTORIUM_ONOMASTICON[key];
        var sheet = document.getElementById('activeMeaningSheet');
        sheet.style.opacity = '0';

        setTimeout(function() {
            var imgKey = key.charAt(0).toUpperCase() + key.slice(1).replace(/\s+/g, '-');
            var imgSrc = 'assets/images/onomasticon/' + imgKey + '.png';

            sheet.innerHTML = 
                // 1. LEFT HALF BLOCK CONTAINER (Captured Image)
                '<div class="onom-image-frame">' +
                    '<img src="' + imgSrc + '" alt="' + key + '" onerror="this.outerHTML=\\'<span class=&quot;onom-image-placeholder&quot;>✦</span>\\'\">' +
                '</div>' +

                // 2. RIGHT HALF BLOCK CONTAINER (Scrolling Definitions)
                '<div class="onom-text-frame">' +
                    '<div class="hebrew-glyph">' + record.hebrew + '</div>' +
                    (record.geez ? '<div class="geez-glyph">' + record.geez + '</div>' : '') +
                    
                    '<h2 class="meaning-title">' + key.toUpperCase().replace(/-/g, ' ') + '</h2>' +
                    '<div class="phonetic-sub">&lsqb;/' + record.phonetic + '/&rsqb;</div>' +
                    
                    '<div class="data-segment">' +
                        '<h4>ROOT LITERAL MEANING</h4>' +
                        '<p style="color:#fff; font-weight:600; letter-spacing: 0.5px;">' + record.meaning + '</p>' +
                    '</div>' +
                    
                    '<div class="data-segment">' +
                        '<h4>HISTORICAL WITNESS &amp; RECORD</h4>' +
                        '<p>' + record.historicalContext + '</p>' +
                    '</div>' +
                    
                    (record.alliance !== '—' ? '<div class="data-segment">' +
                        '<h4>TRIBAL ALLIANCE COORDINATE</h4>' +
                        '<p class="alliance-text" style="color: var(--gold); font-family:\'Cinzel\'; font-size:1rem;">' + record.alliance + '</p>' +
                    '</div>' : '') +
                '</div>';
            sheet.style.opacity = '1';
        }, 200);
    }
</script>
