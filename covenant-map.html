<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTORIUM | Covenant Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,600&display=swap" rel="stylesheet">
    <script src="assets/audio/scriptorium-audio.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --museum-gold: #d4af37;
            --parchment: #c2b280;
        }

        body, html { margin: 0; padding: 0; background: var(--obsidian); height: 100vh; overflow: hidden; font-family: 'Cinzel', serif; animation: fadeInPage 1.5s ease-in-out; }

        @keyframes fadeInPage {
            from { opacity: 0; filter: blur(10px); }
            to { opacity: 1; filter: blur(0); }
        }

        /* 1. SIDEBAR ANCHOR */
        .museum-sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 80px;
            background: #080808;
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            border: 1px solid rgba(197,160,89,0.15);
            border-radius: 4px;
            font-size: 24px;
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--museum-gold);
            border-color: var(--museum-gold);
            background: rgba(197,160,89,0.08);
        }

        /* 2. THE MAP STAGE */
        #covenantMap {
            margin-left: 80px;
            height: 100vh;
            background: #000;
            filter: sepia(0.9) contrast(1.1) brightness(0.85) hue-rotate(-5deg);
        }

        /* 3. VINTAGE POPUP STYLING */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 15, 15, 0.95) !important;
            color: #fff !important;
            border: 1px solid var(--museum-gold);
            border-radius: 0 !important;
            font-family: 'Cormorant Garamond', serif;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .leaflet-popup-tip { background: var(--museum-gold) !important; }

        .region-label {
            color: var(--museum-gold);
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
            display: block;
        }

        .region-verse { font-style: italic; font-size: 1.32rem; line-height: 1.4; color: #ddd; }

        .leaflet-control-zoom { border: 1px solid var(--museum-gold) !important; border-radius: 0 !important; }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            background: #0a0a0a !important; color: var(--museum-gold) !important; border-radius: 0 !important;
        }

        /* Live Scribe Pulse Marker */
        .scribe-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scribe-ink {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--museum-gold);
            z-index: 10;
        }
        .scribe-ripple {
            position: absolute;
            width: 20px; height: 20px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: scribe-broadcast 4s infinite linear;
        }
        @keyframes scribe-broadcast {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(5); opacity: 0; }
        }

        /* Active Scribes Info */
        .scribe-roster {
            margin-top: auto;
            padding: 12px 10px;
            width: 100%;
            text-align: center;
            border-top: 1px solid rgba(212,175,55,0.1);
        }
        .roster-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 7.2px;
            letter-spacing: 3px;
            color: rgba(212,175,55,0.3);
            margin-bottom: 8px;
        }
        .pulse-dot {
            width: 6px; height: 6px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #4caf50;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .scribe-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.66rem;
            color: rgba(255,255,255,0.2);
            max-height: 100px;
            overflow-y: auto;
            margin: 6px 0;
            text-align: left;
            padding: 0 4px;
        }
        .scribe-names::-webkit-scrollbar { width: 2px; }
        .scribe-names::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.85); border-radius: 1px; }
        .scribe-names .entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
        }
        .scribe-names .entry .time {
            font-size: 0.48rem;
            color: var(--museum-gold-dim);
            font-family: 'Montserrat', sans-serif;
        }
        .scribe-stats {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        .scribe-stats small {
            font-family: 'Montserrat', sans-serif;
            font-size: 6px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.1);
        }
        .scribe-stats .progress-bar {
            height: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .scribe-stats .progress-bar .fill {
            height: 100%;
            background: var(--museum-gold-dim);
            border-radius: 2px;
            transition: width 1s ease;
        }

        /* ═══════════════════════════════════════
           GLOBAL CHAT SCROLL (Scribe's Wall)
        ═══════════════════════════════════════ */
        .chat-scroll-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 260px;
            background: rgba(30,30,45,0.92);
            border: 1px solid rgba(212,175,55,0.1);
            backdrop-filter: blur(8px);
            z-index: 2001;
            border-radius: 4px;
            overflow: hidden;
        }
        .chat-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.48rem;
            letter-spacing: 3px;
            color: rgba(212,175,55,0.3);
            padding: 6px 10px;
            border-bottom: 1px solid rgba(212,175,55,0.05);
            text-align: center;
        }
        .chat-header .witness-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }
        .tab-btn {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.98);
            cursor: pointer;
            padding: 2px 6px;
            border: 1px solid transparent;
            border-radius: 2px;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .tab-btn.active { color: #d4af37; border-color: rgba(212,175,55,0.1); }
        .tab-btn:hover { color: #d4af37; }
        .chat-feed {
            height: 120px;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
        }
        .chat-feed::-webkit-scrollbar { width: 2px; }
        .chat-feed::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.1); border-radius: 1px; }
        .witness-msg {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(255,255,255,0.98);
            margin-bottom: 6px;
            font-size: 0.78rem;
            border-left: 2px solid rgba(212,175,55,0.08);
            padding-left: 8px;
            animation: fadeInText 0.6s ease;
            line-height: 1.4;
        }
        .witness-msg strong { color: #d4af37; font-style: normal; font-family: 'Cinzel', serif; font-size: 0.54rem; letter-spacing: 1px; }
        .witness-msg .type-tag {
            display: inline-block;
            font-size: 0.48rem;
            font-style: normal;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            margin-right: 4px;
        }
        .witness-msg.type-chat { border-left-color: rgba(212,175,55,0.08); }
        .witness-msg.type-prayer {
            border-left-color: #a855f7;
            background: rgba(168,85,247,0.04);
            animation: prayerPulse 4s infinite;
        }
        .witness-msg.type-thanks {
            border-left-color: #fff;
            background: rgba(255,255,255,0.04);
            box-shadow: inset 0 0 12px rgba(212,175,55,0.06);
        }
        @keyframes prayerPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(168,85,247,0.06); }
        }

        /* ═══════════════════════════════════════
           PILLAR OF LIGHT
        ═══════════════════════════════════════ */
        .pillar-container { display: flex; flex-direction: column-reverse; align-items: center; background: none !important; border: none !important; }
        .light-shaft { width: 4px; background: linear-gradient(to top, var(--museum-gold), transparent); animation: pillarFlicker 2s infinite alternate; transform-origin: bottom; border-radius: 2px; }
        .base-glow { width: 24px; height: 24px; background: var(--museum-gold); border-radius: 50%; filter: blur(10px); position: absolute; bottom: -12px; opacity: 0.6; }
        @keyframes pillarFlicker { 0% { opacity: 0.6; transform: scaleY(1); } 100% { opacity: 1; transform: scaleY(1.08); } }

        /* ═══════════════════════════════════════
           UNIFIED LEDGER
        ═══════════════════════════════════════ */
        .ledger-wrapper {
            position: fixed; bottom: 20px; right: 20px;
            width: 260px; max-height: 360px;
            background: rgba(30,30,45,0.92); border: 1px solid rgba(212,175,55,0.1);
            backdrop-filter: blur(8px); z-index: 2001;
            border-radius: 4px; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .ledger-filters { display: flex; border-bottom: 1px solid rgba(212,175,55,0.04); }
        .filter-tab {
            flex: 1; text-align: center; padding: 6px 4px;
            font-family: 'Montserrat', sans-serif; font-size: 0.66rem;
            letter-spacing: 1px; color: rgba(255,255,255,0.98);
            cursor: pointer; transition: 0.3s; border-bottom: 1px solid transparent;
        }
        .filter-tab.active { color: #d4af37; border-bottom-color: #d4af37; }
        .filter-tab:hover { color: #d4af37; }
        .ledger-body {
            flex: 1; overflow-y: auto; padding: 8px 10px;
            max-height: 200px;
        }
        .ledger-body::-webkit-scrollbar { width: 2px; }
        .ledger-body::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.1); border-radius: 1px; }
        .ledger-entry {
            padding: 8px 10px; margin-bottom: 6px;
            background: rgba(255,255,255,0.45);
            border-left: 2px solid #d4af37;
            transition: 0.3s; border-radius: 0 2px 2px 0;
        }
        .entry-prayer { border-left-color: #a855f7; box-shadow: inset 3px 0 8px rgba(168,85,247,0.12); }
        .entry-thanks { border-left-color: #fff; background: rgba(212,175,55,0.07); }
        .entry-meta { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .entry-scribe { font-size: 0.54rem; color: #d4af37; font-family: 'Cinzel', serif; letter-spacing: 1px; }
        .entry-time { font-size: 0.72rem; opacity: 0.6; font-family: 'Montserrat', sans-serif; }
        .entry-content { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.72rem; color: rgba(255,255,255,0.98); line-height: 1.4; }
        .ledger-input-zone { border-top: 1px solid rgba(212,175,55,0.04); padding: 6px; }
        .input-controls select {
            width: 100%; background: transparent; border: none;
            color: #d4af37; font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem; letter-spacing: 2px; padding: 4px 0;
            outline: none; cursor: pointer; text-align: center;
        }
        .ledger-input-zone textarea {
            width: 100%; background: transparent; border: none;
            color: rgba(255,255,255,0.6); font-family: 'Cormorant Garamond', serif;
            font-size: 0.96rem; padding: 6px 0; resize: none;
            outline: none; margin: 4px 0; min-height: 28px;
        }
        .ledger-input-zone textarea::placeholder { color: rgba(255,255,255,0.98); font-style: italic; }
        .ledger-input-zone .seal-btn {
            width: 100%; background: transparent; border: 1px solid rgba(212,175,55,0.06);
            color: #d4af37; padding: 6px;
            font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 4px;
            cursor: pointer; border-radius: 2px; transition: 0.3s;
        }
        .ledger-input-zone .seal-btn:hover { border-color: #d4af37; color: #d4af37; }
        @keyframes fadeInText { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .chat-input-area {
            display: flex;
            border-top: 1px solid rgba(212,175,55,0.04);
        }
        .chat-input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.98);
            padding: 8px 10px;
            font-size: 0.72rem;
            font-family: 'Cormorant Garamond', serif;
            outline: none;
        }
        .chat-input-area input::placeholder { color: rgba(255,255,255,0.3); font-style: italic; }
        .chat-input-area button {
            background: rgba(212,175,55,0.06);
            border: none;
            border-left: 1px solid rgba(212,175,55,0.04);
            color: var(--museum-gold-dim);
            padding: 0 12px;
            cursor: pointer;
            font-size: 0.84rem;
            transition: 0.3s;
        }
        .chat-input-area button:hover { background: rgba(212,175,55,0.17); color: var(--museum-gold); }

        .ghost-witness {
            background: none !important;
            border: none !important;
        }
        .ghost-witness span {
            display: inline-block;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(212,175,55,0.85);
            color: rgba(255,255,255,0.5);
            padding: 4px 12px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.84rem;
            border-radius: 3px;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            animation: ghostFade 10s ease forwards;
            pointer-events: none;
        }
        @keyframes ghostFade {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ═══════════════════════════════════════
           FINAL SEAL OVERLAY
        ═══════════════════════════════════════ */
        .final-seal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(42,32,5,0.95) 0%, rgba(5,5,5,0.98) 100%);
            animation: sealReveal 2s ease forwards;
            pointer-events: none;
        }
        @keyframes sealReveal {
            from { opacity: 0; backdrop-filter: blur(0); }
            to { opacity: 1; backdrop-filter: blur(8px); }
        }
        .final-seal-overlay .seal-content { text-align: center; }
        .final-seal-overlay .seal-content h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.56rem;
            letter-spacing: 10px;
            color: var(--museum-gold);
            text-shadow: 0 0 60px rgba(212,175,55,0.3), 0 0 120px rgba(212,175,55,0.1);
            margin: 0 0 16px;
        }
        .final-seal-overlay .seal-content p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.08rem;
            font-style: italic;
            color: rgba(255,255,255,0.2);
            margin: 0 0 20px;
        }
        .final-seal-overlay .seal-content .scribe-signature {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.48rem;
            letter-spacing: 4px;
            color: rgba(212,175,55,0.85);
        }

    </style>
    <script src="assets/js/sidebar.js"></script>
</head>
<body>
<div id="covenantMap"></div>
<script src="assets/js/scriptorium-core.js"></script>

    <div id="sidebarContainer"></div>
        <div class="scribe-roster">
            <div class="roster-header">
                <span class="pulse-dot"></span>
                <span>ACTIVE WITNESSES</span>
            </div>
            <div id="scribeList" class="scribe-names">
                <div class="entry"><span>&bull; Scribe Elias</span><span class="time">NOW</span></div>
            </div>
            <div class="scribe-stats">
                <small>GLOBAL SYNCHRONIZATION: <span id="syncPercent">5%</span></small>
                <div class="progress-bar"><div id="syncFill" class="fill" style="width:5%"></div></div>
    </div>

<!-- UNIFIED LEDGER -->
<div class="ledger-wrapper">
    <div class="ledger-filters">
        <span class="filter-tab active" onclick="setLedgerFilter('all')">CHRONICLE</span>
        <span class="filter-tab" onclick="setLedgerFilter('prayer')">INTERCESSION</span>
        <span class="filter-tab" onclick="setLedgerFilter('thanks')">GRATITUDE</span>
    </div>
    <div id="unifiedLedger" class="ledger-body">
        <div class="ledger-entry entry-chat" data-type="chat"><div class="entry-meta"><span class="entry-scribe">Elias</span><span class="entry-time">NOW</span></div><div class="entry-content">"The Covenant spans all nations."</div></div>
        <div class="ledger-entry entry-prayer" data-type="prayer"><div class="entry-meta"><span class="entry-scribe">Miriam</span><span class="entry-time">NOW</span></div><div class="entry-content">"Peace over Jerusalem."</div></div>
        <div class="ledger-entry entry-thanks" data-type="thanks"><div class="entry-meta"><span class="entry-scribe">Caleb</span><span class="entry-time">NOW</span></div><div class="entry-content">"For the preservation of the scrolls."</div></div>
    </div>
    <div class="ledger-input-zone">
        <div class="input-controls">
            <select id="witnessMode" onchange="">
                <option value="chat">&#128172; MESSAGE</option>
                <option value="prayer">&#128591; PRAYER</option>
                <option value="thanks">&#128588; THANKS</option>
            </select>
        </div>
        <textarea id="witnessText" placeholder="Add to the eternal record..." maxlength="120"></textarea>
        <button onclick="commitWitness()" class="seal-btn">AFFIX SEAL</button>
    </div>
</div>

<!-- Thanksgiving Pillar -->
<div id="thanksPillar" class="thanks-pillar">
    <div class="pillar-bar" id="pillarBar" style="height:4px;"></div>
    <div class="pillar-count"><span id="thanksCount">0</span> THANKS</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
        var map = L.map('covenantMap').setView([20.5937, 78.9629], 5);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: 'Scriptorium Sacred Map'
        }).addTo(map);
        
        // Digging cursor animation on map click
        map.on('mousedown', function() { document.body.classList.add('digging-active'); });
        map.on('mouseup', function() { document.body.classList.remove('digging-active'); });
        
        var sacredSites = [
            {
                name: "ANATHA",
                coords: [26.2955, 73.0187],
                verse: "Josh 11:21 - Anath was among the cities of the spies who went up from Hebron."
            },
            {
                name: "PUSHTAKAR",
                coords: [24.5854, 73.7125],
                verse: "Est 8:17 - Many peoples joined the Jews because the fear of them had fallen upon all."
            },
            {
                name: "BARYGaza",
                coords: [22.3072, 73.1899],
                verse: "Ezek 27:19 - Greece, Tubal, and Meshech traded with you; they exchanged slaves and bronze items."
            },
            {
                name: "MUZIRIS",
                coords: [10.5276, 76.1854],
                verse: "1 Kgs 9:28 - Their ships went to Ophir and returned with 420 talents of gold."
            },
            {
                name: "TAJ",
                coords: [27.1751, 78.0421],
                verse: "Is 2:4 - Nation shall not lift up sword against nation, neither shall they learn war anymore."
            },
            {
                name: "VARANASI",
                coords: [25.3176, 82.9739],
                verse: "Is 60:3 - Nations shall come to your light, and kings to the brightness of your rising."
            }
        ];

        var goldIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:rgba(212,175,55,0.7); width:14px; height:14px; border-radius:50%; box-shadow:0 0 20px #d4af37; border:2px solid rgba(212,175,55,0.8);'></div>",
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        sacredSites.forEach(function(site) {
            L.marker(site.coords, { icon: goldIcon }).addTo(map)
                .bindPopup("<span class='region-label'>" + site.name + "</span><p class='region-verse'>" + site.verse + "</p>");
        });

        // ==================== SCRIBE PRESENCE SYSTEM ====================
        var scribeMarkers = {};

        function registerNewScribe(name, location) {
            var id = name.replace(/\s/g, '_').toLowerCase();

            var icon = L.divIcon({
                className: 'scribe-marker',
                html: '<div class="scribe-ripple"></div><div class="scribe-ink"></div>',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            var marker = L.marker(location, { icon: icon }).addTo(map);
            marker.bindTooltip("LIVE: " + name, { direction: 'top', className: 'museum-tooltip-style', offset: [0, -10] });
            scribeMarkers[id] = marker;

            var list = document.getElementById('scribeList');
            var entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = '<span>&bull; ' + name + '</span><span class="time">JUST NOW</span>';
            list.prepend(entry);

            if (window.ScriptoriumAudio) {
                try { window.ScriptoriumAudio.transitionTo('nt'); } catch(e) {}
            }
            updateSync();
        }

        function updateSync() {
            var count = document.getElementById('scribeList').children.length;
            var pct = Math.min(count * 8, 100);
            document.getElementById('syncPercent').textContent = pct + '%';
            document.getElementById('syncFill').style.width = pct + '%';
        }

        // Simulate live scribes arriving
        var covenantLocs = [
            [31.7683, 35.2137], [31.5250, 35.4531], [32.7764, 35.3204],
            [32.0833, 34.7833], [31.0458, 35.2583], [31.7000, 35.2000],
            [40.7128, -74.0060], [51.5074, -0.1278], [48.8566, 2.3522]
        ];

        var names = ['Scribe Miriam', 'Scribe Thomas', 'Scribe Esther', 'Scribe Simeon',
                     'Scribe Hannah', 'Scribe Caleb', 'Scribe Tabitha', 'Scribe Jethro'];

        setTimeout(function() {
            registerNewScribe('Scribe Miriam', [40.7128, -74.0060]);
        }, 5000);

        setTimeout(function() {
            registerNewScribe('Scribe Thomas', [51.5074, -0.1278]);
        }, 13000);

        // Periodic random scribes
        setInterval(function() {
            var name = names[Math.floor(Math.random() * names.length)];
            var loc = covenantLocs[Math.floor(Math.random() * covenantLocs.length)];
            var offset = (Math.random() - 0.5) * 0.3;
            registerNewScribe(name + '_' + Math.random().toString(36).substring(2, 5), [loc[0] + offset, loc[1] + offset]);
        }, 22000);

        // ==================== UNIFIED LEDGER ====================
        var currentFilter = 'all';

        window.commitWitness = function() {
            var type = document.getElementById('witnessMode').value;
            var textarea = document.getElementById('witnessText');
            var content = textarea.value.trim();
            if (!content) return;

            var scribe = JSON.parse(localStorage.getItem('activeScribe')) || { name: 'Unknown Scribe' };
            var entry = {
                id: Date.now(),
                scribe: scribe.name,
                type: type,
                text: content,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            if (type === 'prayer') {
                var pc = parseInt(localStorage.getItem('scribe_prayer_count') || '0') + 1;
                localStorage.setItem('scribe_prayer_count', pc.toString());
                spawnIncense(content);
            } else if (type === 'thanks') {
                var tc = parseInt(localStorage.getItem('scribe_thanks_count') || '0') + 1;
                localStorage.setItem('scribe_thanks_count', tc.toString());
                document.getElementById('thanksCount').textContent = tc;
                var h = Math.min(tc * 6, 200);
                document.getElementById('pillarBar').style.height = h + 'px';
                updatePillarOfLight(tc);
            }

            renderEntry(entry);
            textarea.value = '';
            if (window.checkAchievements) setTimeout(checkAchievements, 500);
            if (window.ScriptoriumAudio) { try { window.ScriptoriumAudio.transitionTo('nt'); } catch(e) {} }
        };

        function spawnIncense(text) {
            var center = map.getCenter();
            var marker = L.marker(center, {
                icon: L.divIcon({
                    className: 'incense-label prayer-glow',
                    html: '<div class="rising-text">&#128591; \u201C' + text.substring(0, 50) + '\u201D</div>',
                    iconSize: [300, 50],
                    iconAnchor: [150, 25]
                })
            }).addTo(map);
            setTimeout(function() { map.removeLayer(marker); }, 10000);
        }

        function renderEntry(entry) {
            var container = document.getElementById('unifiedLedger');
            var div = document.createElement('div');
            div.className = 'ledger-entry entry-' + entry.type;
            div.setAttribute('data-type', entry.type);
            div.innerHTML = '<div class="entry-meta"><span class="entry-scribe">' + entry.scribe + '</span><span class="entry-time">' + entry.timestamp + '</span></div><div class="entry-content">"' + entry.text + '"</div>';
            container.prepend(div);
            applyFilter();
            if (container.scrollHeight > 200) container.scrollTop = 0;
        }

        window.setLedgerFilter = function(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
            event.target.classList.add('active');
            applyFilter();
        };

        function applyFilter() {
            var entries = document.querySelectorAll('.ledger-entry');
            entries.forEach(function(el) {
                if (currentFilter === 'all' || el.getAttribute('data-type') === currentFilter) {
                    el.style.display = 'block';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        // Completion trigger when sync reaches 100%
        var origUpdateSync = updateSync;
        window.updateSync = function() {
            origUpdateSync();
            var pct = parseInt(document.getElementById('syncPercent').textContent);
            if (pct >= 100) {
                performGrandFinale();
            }
        };

        function performGrandFinale() {
            document.body.style.transition = "background 5s ease-in-out";
            document.body.style.background = "radial-gradient(circle, #2a2005 0%, #050505 100%)";

            if (window.ScriptoriumAudio) {
                try { window.ScriptoriumAudio.transitionTo('nt'); } catch(e) {}
            }

            var overlay = document.createElement('div');
            overlay.className = 'final-seal-overlay';
            overlay.innerHTML = '' +
                '<div class="seal-content">' +
                    '<h1>SCRIPTORIUM COMPLETE</h1>' +
                    '<p>"The grass withers, the flower fades, but the word of our God will stand forever."</p>' +
                    '<div class="scribe-signature">Finalized by the Order of Scribes</div>' +
                '</div>';
            document.body.appendChild(overlay);
            setTimeout(function() { overlay.remove(); }, 6000);
        };

        // ═══════════════════════════════════════
        // PILLAR OF LIGHT — Global Thanksgiving Monument
        // ═══════════════════════════════════════
        var globalThanksCount = parseInt(localStorage.getItem('scribe_thanks_count') || '0');

        function updatePillarOfLight(count) {
            count = count || globalThanksCount;
            if (window.pillarMarker) map.removeLayer(window.pillarMarker);

            var height = Math.min(count * 2, 500);
            var glow = Math.min(count / 5, 50);

            var icon = L.divIcon({
                className: 'pillar-container',
                html: '<div class="light-shaft" style="height:' + height + 'px;box-shadow:0 0 ' + glow + 'px var(--museum-gold);"></div><div class="base-glow"></div>',
                iconSize: [40, 0],
                iconAnchor: [20, 0]
            });

            window.pillarMarker = L.marker([31.7683, 35.2137], { icon: icon }).addTo(map);

            var darkness = Math.max(0.4, 0.9 - (count / 1000));
            var v = document.querySelector('#covenantMap');
            if (v) {
                v.style.boxShadow = 'inset 0 0 ' + (100 - count * 0.5) + 'px rgba(0,0,0,' + darkness + ')';
            }
        }

        // Init pillar and thanks display
        document.getElementById('thanksCount').textContent = globalThanksCount;
        var h = Math.min(globalThanksCount * 6, 200);
        document.getElementById('pillarBar').style.height = h + 'px';
        setTimeout(function() { updatePillarOfLight(globalThanksCount); }, 1000);
    </script>
</body>
</html>
