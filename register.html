    <style>
        :root {
            --obsidian: #050505;
            --museum-gold: #d4af37;
            --museum-gold-dim: rgba(212,175,55,0.4);
            --museum-gold-faint: rgba(212,175,55,0.08);
        }
        body {
            padding:40px 0 40px 80px;
        }
        .glow-overlay {
            position:fixed;inset:0;
            background:radial-gradient(circle,rgba(212,175,55,0.04) 0%,transparent 70%);
            pointer-events:none;
        }
        .scroll-frame {
            width:560px;max-width:92vw;
            padding:50px 48px;
            background:rgba(10,10,10,0.88);
            border:1px solid var(--museum-gold-dim);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            box-shadow:0 0 100px rgba(0,0,0,1);
            position:relative;z-index:1;
            border-radius:4px;
            transition:opacity 0.8s ease, transform 0.8s ease;
        }
        .scroll-frame.fade-out{opacity:0;transform:translateY(-20px);}
        .scroll-frame .label{
            font-family:'Montserrat',sans-serif;
            font-size: 0.48rem;letter-spacing:5px;
            color:rgba(212,175,55,0.2);display:block;text-align:center;margin-bottom:8px;
        }
        .scroll-frame h1{
            font-size: 1.56rem;letter-spacing:10px;
            color:var(--museum-gold);text-align:center;
            margin:0 0 36px;
            text-shadow:0 0 30px rgba(212,175,55,0.06);

        .form-section{margin-bottom:32px;text-align:left;}
        .section-title{
            font-family:'Montserrat',sans-serif;
            font-size: 0.54rem;letter-spacing:4px;
            color:var(--museum-gold-dim);
            border-bottom:1px solid rgba(212,175,55,0.04);
            padding-bottom:6px;margin-bottom:16px;opacity:0.6;
        }
        .input-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .input-group{margin-bottom:16px;position:relative;}
        .input-group label{
            display:block;
            font-family:'Montserrat',sans-serif;
            font-size: 0.72rem;letter-spacing:2px;
            color:rgba(212,175,55,0.2);margin-bottom:4px;

        .input-group input,.input-group select{
            width:100%;

            border:none;
            border-bottom:1px solid rgba(212,175,55,0.08);
            color:rgba(255,255,255,0.4);
            font-family:'Cormorant Garamond',serif;
            font-size: 0.66rem;padding:6px 2px;

        .input-group input::placeholder{color:rgba(255,255,255,0.04);font-style:italic;}
        .input-group select{appearance:none;cursor:pointer;}
        .input-group select option{background:#111;color:#ccc;}

        .level-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
        .level-selector input{display:none;}
        .level-selector label{
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(212,175,55,0.06);
            padding:12px 8px;text-align:center;cursor:pointer;
            font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:2px;
            color:rgba(255,255,255,0.45);transition:all 0.3s;border-radius:3px;
        }
        .level-selector label:hover{border-color:rgba(212,175,55,0.85);color:var(--museum-gold-dim);}
        .level-selector input:checked+label{
            background:var(--museum-gold);color:#000;
            box-shadow:0 0 15px rgba(212,175,55,0.2);
        }
        .level-selector label span{
            display:block;font-family:'Cormorant Garamond',serif;
            font-size: 0.66rem;opacity:0.5;margin-top:3px;
        }
        .level-selector input:checked+label span{opacity:0.7;}
        .meter-bar{height:2px;width:0%;background:#555;transition:all 0.3s;margin-top:4px;border-radius:2px;}
        .rule-met{color:var(--museum-gold)!important;}
        .cipher-rules li{transition:color 0.3s;}
        .seal-button{
            display:block;margin:36px auto 0;
            background:transparent;
            border:1px solid rgba(212,175,55,0.85);
            color:var(--museum-gold-dim);
            padding:14px 36px;
            font-family:'Cinzel',serif;
            font-size: 0.66rem;letter-spacing:5px;
            cursor:pointer;transition:all 0.5s ease;
            border-radius:4px;
        }
        .seal-button:hover{
            background:var(--museum-gold);
            color:#000;
            box-shadow:0 0 30px rgba(212,175,55,0.2);
            transform:scale(1.02);
        }
        .guest-link{
            display:block;margin-top:12px;text-align:center;
            font-family:'Montserrat',sans-serif;
            font-size: 0.72rem;letter-spacing:2px;
            color:rgba(255,255,255,0.04);
            text-decoration:none;transition:color 0.3s;
        }
        .guest-link:hover{color:rgba(212,175,55,0.1);}
        .back-link{display:block;margin-top:4px;font-family:'Montserrat',sans-serif;font-size: 0.72rem;letter-spacing:2px;color:rgba(255,255,255,0.03);text-decoration:none;transition:color 0.3s;}
        .back-link:hover{color:rgba(212,175,55,0.1);}
        @media(max-width:600px){.input-row{grid-template-columns:1fr;}.scroll-frame{padding:30px 24px;}}

        .modal-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);animation:fadeInPage 0.5s ease;}
        .museum-modal{background:rgba(10,10,10,0.95);border:1px solid var(--museum-gold-dim);padding:40px;max-width:400px;text-align:center;border-radius:4px;}
        .museum-modal h2{font-family:'Cinzel',serif;font-size: 0.66rem;letter-spacing:6px;color:var(--museum-gold);margin:0 0 10px;}
        .museum-modal p{font-family:'Cormorant Garamond',serif;font-size: 0.66rem;color:rgba(255,255,255,0.2);font-style:italic;margin:0 0 24px;}
        .modal-actions{display:flex;gap:10px;justify-content:center;}
        .modal-actions button{background:transparent;border:1px solid rgba(212,175,55,0.17);color:rgba(212,175,55,0.3);padding:8px 18px;font-family:'Cinzel',serif;font-size: 0.54rem;letter-spacing:3px;cursor:pointer;border-radius:3px;transition:0.3s;}
        .modal-actions button:hover{border-color:var(--museum-gold);color:var(--museum-gold);}
        .modal-actions .primary{background:var(--museum-gold);color:#000;border-color:var(--museum-gold);}
        .modal-actions .primary:hover{box-shadow:0 0 20px rgba(212,175,55,0.2);}
    </style>
</head>

<script>
    window.checkStrength = function(p) {
        var strength = 0;
        var len = p.length >= 8;
        var num = /[0-9]/.test(p);
        var spec = /[!@#$%^&*]/.test(p);
        if (len) { strength += 33; document.getElementById('ruleLen').classList.add('rule-met'); } else { document.getElementById('ruleLen').classList.remove('rule-met'); }
        if (num) { strength += 33; document.getElementById('ruleNum').classList.add('rule-met'); } else { document.getElementById('ruleNum').classList.remove('rule-met'); }
        if (spec) { strength += 34; document.getElementById('ruleSpec').classList.add('rule-met'); } else { document.getElementById('ruleSpec').classList.remove('rule-met'); }
        var meter = document.getElementById('strengthMeter');
        if (meter) { meter.style.width = strength + '%'; meter.style.background = strength === 100 ? '#d4af37' : (strength > 33 ? '#b8860b' : '#8b0000'); }
    };

    function validateCipher(p) { return /^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}$/.test(p); }

    async function hashPassword(pass) {
        if (!crypto || !crypto.subtle || !crypto.subtle.digest) {
            throw new Error('CRYPTO_UNAVAILABLE');
        }
        var enc = new TextEncoder();
        var buf = await crypto.subtle.digest('SHA-256', enc.encode(pass));
        var arr = Array.from(new Uint8Array(buf));
        return arr.map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
    }

    document.getElementById('inductionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var pass = document.getElementById('regPassword').value;
        if (!validateCipher(pass)) {
            alert('Your Cipher Key must be at least 8 characters with at least one number and one special character (!@#$%^&*).');
            return;
        }
        var hashed;
        try { hashed = await hashPassword(pass); } catch (h) {
            if (h.message === 'CRYPTO_UNAVAILABLE') { alert('Your browser does not support cryptographic functions on file://. Please use Chrome, Edge, or Firefox.'); return; }
            alert('An unexpected error occurred during registration.'); return;
        }
        var kb = document.querySelector('input[name="kb"]:checked').value;
        var rankTitles = { '1': 'Novice of the Outer Court', '2': 'Student of the Living Word', '3': 'Witness of the Covenant', '4': 'Scribe of the High Archive' };
        var countrySelect = document.getElementById('regCountry');
        var countryText = countrySelect.options[countrySelect.selectedIndex].text;
        var profile = {
            name: document.getElementById('regName').value,
            country: document.getElementById('regCountry').value,
            countryName: countryText,
            city: document.getElementById('regCity').value,
            location: countryText + ', ' + document.getElementById('regCity').value,
            userId: document.getElementById('regId').value,
            email: document.getElementById('regEmail').value,
            password: hashed,
            dob: document.getElementById('regDob').value,
            gender: document.getElementById('regGender').value,
            knowledge: kb,
            rank: rankTitles[kb] || 'Seeker',
            joined: new Date().toISOString(),
            lastActive: Date.now(),
            totalCharacters: 0,
            versesCompleted: 0,
            ntVerses: 0,
            _v: 2
        };
        localStorage.setItem('activeScribe', JSON.stringify(profile));
        localStorage.setItem('scribeData', JSON.stringify({
            name: profile.name,
            totalCharacters: 0,
            rank: profile.rank,
            versesCompleted: 0,
            ntVerses: 0,
            _v: 2
        }));
        document.getElementById('scrollFrame').classList.add('fade-out');
        if (window.ScriptoriumAudio) { try { window.ScriptoriumAudio.transitionTo('ot'); } catch(e) {} }
        showInductionModal();
    });

    function showInductionModal() {
        var modal = document.createElement('div');

        modal.innerHTML = '<div class="museum-modal"><h2>INDUCTION COMPLETE</h2><p>Your seal has been affixed to the eternal record.</p><div class="modal-actions"><button onclick="this.closest(\'.modal-overlay\').remove();window.location.href=\'scriptorium.html\'" class="primary">ENTER THE ARCHIVE</button><button onclick="this.closest(\'.modal-overlay\').remove();setTimeout(function(){window.generateScribeCertificate()},100)">DOWNLOAD CREDENTIALS</button><button onclick="this.closest(\'.modal-overlay\').remove();setTimeout(function(){window.generateWelcomeLetter()},100)">&#128231; LETTER OF APPOINTMENT</button></div></div>';
        document.body.appendChild(modal);
    }

    function openDocWindow(html) {
        var blob = new Blob([html], {type: 'text/html'});
        var url = URL.createObjectURL(blob);
        var w = window.open(url, '_blank');
        if (!w || w.closed) {
            var a = document.createElement('a');
            a.href = url;
            a.download = 'document.html';
            a.click();
        }
    }

            'body{margin:0;padding:0;background:#0a0a0a;font-family:"Cormorant Garamond",serif;color:#e0e0e0;min-height:100vh;}' +

            '</style></head><body>' +
            '<div class="doc-watermark">SCRIPTORIUM</div>' +

            '<div class="doc-type">' + (opts.docType || 'OFFICIAL DOCUMENT') + '</div>' +

    window.generateScribeCertificate = function() {
        var scribe = JSON.parse(localStorage.getItem('activeScribe'));
        if (!scribe) return;
        var titles = { '1': 'Novice of the Outer Court', '2': 'Student of the Living Word', '3': 'Witness of the Covenant', '4': 'Scribe of the High Archive' };
        var body = '<div style="text-align:center;padding:20px 0;">' +
            '<p style="font-size:1.1rem;color:rgba(255,255,255,0.5);margin:0 0 30px;font-style:italic;">Official Credentials of the Order</p>' +
            '<p style="font-size:1.3rem;line-height:1.8;margin:0 0 30px;">This document certifies that the soul known as<br>' +
            '<span style="font-family:\'Cinzel\',serif;font-size:2rem;color:#d4af37;letter-spacing:4px;display:inline-block;margin:15px 0;border-bottom:1px solid rgba(212,175,55,0.3);padding-bottom:5px;">' + scribe.name + '</span><br>' +
            'hailing from <strong style="color:#e6c667;">' + (scribe.city || '') + ', ' + (scribe.countryName || 'Unknown') + '</strong><br>' +
            'has been formally inducted with the standing of:</p>' +
            '<p style="font-family:\'Cinzel\',serif;font-size:1.4rem;color:#d4af37;letter-spacing:3px;margin:0 0 30px;">' + (titles[scribe.knowledge] || 'Seeker') + '</p>' +
            '<div style="width:80px;height:80px;margin:0 auto 20px;background:rgba(183,28,28,0.8);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:\'Cinzel\',serif;font-size:2.5rem;color:#fff;box-shadow:3px 3px 15px rgba(0,0,0,0.4);">S</div>' +
            '<p style="font-size:0.85rem;color:rgba(255,255,255,0.3);margin:0;">Scribe ID: ' + (scribe.userId || '\u2014') + ' &bull; Joined: ' + new Date(scribe.joined).toLocaleDateString() + '</p>' +
            '</div>';
        openDocWindow(buildDocTemplate({ docType: 'CERTIFICATE OF INDUCTION', body: body }));
    };

    window.generateWelcomeLetter = function() {
        var s = JSON.parse(localStorage.getItem('activeScribe'));
        if (!s) return;
        var gender = s.gender === 'female' ? 'Sister' : 'Brother';
        var titles = { '1': 'Novice of the Outer Court', '2': 'Student of the Living Word', '3': 'Witness of the Covenant', '4': 'Scribe of the High Archive' };
        var body = '<p style="font-family:\'Cinzel\',serif;font-size:1.2rem;color:#d4af37;margin:0 0 20px;">Greetings, ' + gender + ' ' + s.name + ',</p>' +
            '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">Your petition for induction into the <strong style="color:#e6c667;">Order of Scribes</strong> has been reviewed and accepted. Your seal is now affixed to the global chronicle, marking your place among the witnesses of the Covenant.</p>' +
            '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">Based on your scholarship, you have been granted the following standing within the Archive:</p>' +
            '<div style="background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.2);padding:20px;margin:20px 0;border-radius:3px;">' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,175,55,0.08);"><span style="font-family:\'Cinzel\',serif;font-size:0.65rem;letter-spacing:2px;color:rgba(212,175,55,0.4);">SCRIBE ID</span><span style="font-size:0.95rem;color:#e0e0e0;">' + (s.userId || '\u2014') + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,175,55,0.08);"><span style="font-family:\'Cinzel\',serif;font-size:0.65rem;letter-spacing:2px;color:rgba(212,175,55,0.4);">REGION</span><span style="font-size:0.95rem;color:#e0e0e0;">' + ((s.city && s.countryName) ? (s.city + ', ' + s.countryName) : (s.location || 'Unknown')) + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;"><span style="font-family:\'Cinzel\',serif;font-size:0.65rem;letter-spacing:2px;color:rgba(212,175,55,0.4);">STANDING</span><span style="font-family:\'Cinzel\',serif;font-size:0.95rem;color:#d4af37;">' + (titles[s.knowledge] || 'Seeker') + '</span></div>' +
            '</div>' +
            '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">You may now enter the Scriptorium to read, compare, and chronicle. Your journey has been marked from this day forward.</p>' +
            '<p style="font-style:italic;color:rgba(212,175,55,0.5);font-size:0.95rem;margin:0;text-align:center;">"Let the wise hear and increase in learning." \u2014 Proverbs 1:5</p>';
        openDocWindow(buildDocTemplate({ docType: 'LETTER OF APPOINTMENT', body: body }));
    };

    window.generateMilestone = function() {
        var s = JSON.parse(localStorage.getItem('activeScribe')) || { name: 'Scribe' };
        var streak = JSON.parse(localStorage.getItem('scribe_logia_streak')) || { count: 0 };
        var body = '<div style="text-align:center;padding:10px 0 25px;">' +
            '<div style="font-size:2.5rem;margin-bottom:10px;">&#x1F52E;</div>' +
            '<p style="font-family:\'Cinzel\',serif;font-size:0.65rem;letter-spacing:4px;color:rgba(212,175,55,0.4);margin:0 0 5px;">RANK ASCENDED</p>' +
            '<p style="font-family:\'Cinzel\',serif;font-size:1.6rem;color:#d4af37;letter-spacing:4px;margin:0 0 20px;">The Guardian</p>' +
            '</div>' +
            '<p style="font-size:1.1rem;line-height:1.8;margin:0 0 20px;">Peace be with you, <strong style="color:#e6c667;">' + s.name + '</strong>.</p>' +
            '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">Thirty suns have risen and set since you began your vigil in the Scriptorium. Your consistency has not gone unnoticed by the Order.</p>' +
            '<p style="font-size:1.05rem;margin:0 0 20px;">Your current streak: <strong style="color:#d4af37;">' + streak.count + ' days</strong></p>' +
            '<div style="background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.2);padding:20px;margin:20px 0;border-radius:3px;">' +
            '<p style="font-family:\'Cinzel\',serif;font-size:0.65rem;letter-spacing:3px;color:rgba(212,175,55,0.5);margin:0 0 15px;">NEW POWERS UNLOCKED</p>' +
            '<ul style="list-style:none;padding:0;margin:0;">' +
            '<li style="padding:6px 0;border-bottom:1px solid rgba(212,175,55,0.06);font-size:0.95rem;line-height:1.5;"><strong style="color:#e6c667;">Celestial Aura:</strong> Your marker on the Map now pulses with blue-gold light.</li>' +
            '<li style="padding:6px 0;border-bottom:1px solid rgba(212,175,55,0.06);font-size:0.95rem;line-height:1.5;"><strong style="color:#e6c667;">Guardian\'s Ink:</strong> Your messages in the Witness Wall carry the Guardian\'s shimmer.</li>' +
            '<li style="padding:6px 0;font-size:0.95rem;line-height:1.5;"><strong style="color:#e6c667;">Deeper Access:</strong> Obscure archaeological dossiers are now visible to your eyes.</li>' +
            '</ul></div>' +
            '<p style="font-style:italic;color:rgba(212,175,55,0.5);font-size:0.95rem;margin:0;text-align:center;">Continue your toil, faithful scribe. The Word is eternal.</p>';
        openDocWindow(buildDocTemplate({ docType: 'MILESTONE ACHIEVEMENT', body: body }));
    };

    window.generatePasswordReset = function() {
        var s = JSON.parse(localStorage.getItem('activeScribe')) || { name: 'Scribe', userId: '\u2014' };
        var body = '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">A request has been received to reset the <strong style="color:#e6c667;">Cipher Key</strong> associated with your identity <strong style="color:#d4af37;">' + s.userId + '</strong> in the Scriptorium.</p>' +
            '<p style="font-size:1.05rem;line-height:1.8;margin:0 0 20px;">To forge a new key and regain access to your scrolls and discoveries, please use the secure link below. This portal will remain open for only one hour.</p>' +
            '<div style="text-align:center;margin:30px 0;"><a href="#" style="display:inline-block;border:1px solid rgba(212,175,55,0.4);color:#d4af37;padding:12px 30px;text-decoration:none;font-family:\'Cinzel\',serif;font-size:0.7rem;letter-spacing:3px;border-radius:3px;">REFORGE CIPHER KEY</a></div>' +
            '<p style="font-style:italic;color:rgba(255,255,255,0.3);font-size:0.9rem;margin:0;text-align:center;">If you did not request this restoration, your current cipher remains secure. No action is required from your hand.</p>';
        openDocWindow(buildDocTemplate({ docType: 'CIPHER KEY RESTORATION', body: body }));
    };
</script>
